<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Puzzles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        h1 { color: #ffd700; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 1.8rem; }
        
        .info-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; width: 100%; max-width: 450px; box-sizing: border-box; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .puzzle-title { color: #06d6a0; font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .puzzle-desc { color: #e0e0e0; font-size: 1rem; }
        
        .board-wrapper { position: relative; width: 100%; max-width: 450px; margin-bottom: 20px; }
        #board { width: 100%; border: 4px solid #ffd700; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); background-color: #ffffff; }
        
        .board-juven .white-1e1d7 { background-color: #e0e0e0; color: #0b132b; }
        .board-juven .black-3c85d { background-color: #1c2541; color: #e0e0e0; }

        .btn-volver { background-color: #3a506b; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 450px; font-size: 1.1rem; margin-bottom: 10px; transition: 0.3s;}
        .btn-volver:hover { background-color: #2a3a4f; }
        
        .btn-siguiente { background-color: #06d6a0; color: #0b132b; font-weight: bold; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 450px; font-size: 1.1rem; display: none; margin-bottom: 10px; transition: 0.3s; box-shadow: 0 0 10px #06d6a0;}
        .btn-siguiente:hover { background-color: #05b383; }
        
        .highlight-wrong { box-shadow: inset 0 0 3px 3px red !important; }
        .highlight-correct { box-shadow: inset 0 0 3px 3px #06d6a0 !important; }
    </style>
</head>
<body>

    <h1><i class="fas fa-puzzle-piece"></i> ENTRENAMIENTO</h1>
    
    <div class="info-panel">
        <div class="puzzle-title" id="pTitle">Cargando...</div>
        <div class="puzzle-desc" id="pDesc">Prepárate para resolver.</div>
    </div>
    
    <div class="board-wrapper">
        <div id="board" class="board-juven"></div>
    </div>

    <button class="btn-siguiente" id="btnSiguiente" onclick="siguientePuzzle()"><i class="fas fa-forward"></i> Siguiente Puzzle</button>
    <button class="btn-volver" onclick="window.location.href='menu.html';"><i class="fas fa-arrow-left"></i> Volver al Menú</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

    <script>
        // BASE DE DATOS DE PUZZLES (Puedes agregar más siguiendo este formato)
        const puzzles = [
            {
                title: "1. Mate de Pasillo",
                desc: "Juegan Blancas y dan Jaque Mate en 1 movimiento.",
                fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1",
                from: "d1", to: "d8",
                orientation: "white"
            },
            {
                title: "2. Mate de Pastor",
                desc: "Juegan Blancas y dan Jaque Mate en 1 movimiento.",
                fen: "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4",
                from: "h5", to: "f7",
                orientation: "white"
            },
            {
                title: "3. Mate del Loco",
                desc: "Juegan Negras y dan Jaque Mate en 1 movimiento.",
                fen: "rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b KQkq - 0 2",
                from: "d8", to: "h4",
                orientation: "black"
            },
            {
                title: "4. Beso de la Muerte",
                desc: "Juegan Blancas y dan Jaque Mate en 1 movimiento.",
                fen: "7k/7p/7K/8/8/8/8/6Q1 w - - 0 1",
                from: "g1", to: "g7",
                orientation: "white"
            }
        ];

        let puzzleActual = 0;
        let resuelto = false;

        var board = null;
        var game = new Chess();
        var $board = $('#board');

        function pieceTheme(piece) {
            const customPieces = {
                'wP': 'chemapeon.png', 'wN': 'chemacaballo.png', 'wB': 'chemaalfil.png', 'wR': 'chematorre.png', 'wQ': 'chemareyna.png', 'wK': 'chemarey.png',
                'bP': 'goyopeon.png', 'bN': 'goyocaballo.png', 'bB': 'goyoalfil.png', 'bR': 'goyotorre.png', 'bQ': 'goyoreina.png', 'bK': 'goyorey.png'
            };
            return customPieces[piece];
        }

        function cargarPuzzle() {
            resuelto = false;
            document.getElementById('btnSiguiente').style.display = 'none';
            
            if (puzzleActual >= puzzles.length) {
                Swal.fire({ title: '¡Felicidades!', text: 'Has completado todos los puzzles disponibles.', icon: 'success', background: '#1c2541', color: '#fff', confirmButtonColor: '#06d6a0' });
                puzzleActual = 0; // Reiniciar
            }

            const p = puzzles[puzzleActual];
            document.getElementById('pTitle').innerText = p.title;
            document.getElementById('pDesc').innerText = p.desc;
            
            game.load(p.fen);
            board.orientation(p.orientation);
            board.position(game.fen());
        }

        function onDragStart(source, piece) {
            if (resuelto) return false;
            // Solo permitir mover el color del turno actual del puzzle
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            const p = puzzles[puzzleActual];
            
            // Verificar si el movimiento es legal en ajedrez
            var move = game.move({ from: source, to: target, promotion: 'q' });
            
            if (move === null) return 'snapback';

            // Comprobar si resolvió el puzzle
            if (source === p.from && target === p.to) {
                resuelto = true;
                lanzarConfeti();
                $board.find('.square-' + target).addClass('highlight-correct');
                
                Swal.fire({ title: '¡Brillante!', text: 'Movimiento correcto.', icon: 'success', timer: 2000, showConfirmButton: false, background: '#1c2541', color: '#fff' });
                document.getElementById('btnSiguiente').style.display = 'block';
            } else {
                // Movimiento incorrecto, deshacer y avisar
                game.undo();
                $board.find('.square-' + target).addClass('highlight-wrong');
                setTimeout(() => $board.find('.square-' + target).removeClass('highlight-wrong'), 1000);
                
                Swal.fire({ title: 'Casi...', text: 'Ese movimiento no resuelve el problema. ¡Intenta de nuevo!', icon: 'error', background: '#1c2541', color: '#fff', confirmButtonColor: '#d62828' });
                return 'snapback';
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function siguientePuzzle() {
            puzzleActual++;
            cargarPuzzle();
        }

        function lanzarConfeti() {
            var duration = 2 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#06d6a0'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#06d6a0'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        var config = {
            draggable: true, showNotation: true, pieceTheme: pieceTheme,
            onDragStart: onDragStart, onDrop: onDrop, onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('board', config);
        
        // Iniciar el primer puzzle
        setTimeout(cargarPuzzle, 500);

    </script>
</body>
</html>
