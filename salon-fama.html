<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06152D">
  <title>JUVENCHESS | Arena Multijugador</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-app: #06152D; --bg-panel: #0F294D;
      --text-main: #F8FAFC; --text-muted: #94A3B8;
      --gold: #FACC15; --green: #10B981; --danger: #EF4444;
      --sq-light: #FEF3C7; --sq-dark: #1E3A8A;
    }
    [data-theme="green-yellow"] { --sq-light: #FEF08A; --sq-dark: #065F46; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-app); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); overflow-x: hidden; }

    .arena-layout { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 1100px; align-items: flex-start; }
    @media (max-width: 800px) { .arena-layout { flex-direction: column; align-items: center; gap: 10px; } .sidebar-section { width: 100% !important; max-height: 40vh; } }

    .board-section { flex: 1; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 650px; }

    .player-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .player-info { display: flex; align-items: center; gap: 12px; }
    .player-avatar { width: clamp(40px, 10vw, 50px); height: clamp(40px, 10vw, 50px); border-radius: 6px; object-fit: cover; background: #000; border: 2px solid rgba(255,255,255,0.1); }
    .player-details { display: flex; flex-direction: column; }
    .player-name { font-size: clamp(0.9rem, 3vw, 1.1rem); font-weight: 800; }
    .player-elo { font-size: 0.75rem; color: var(--text-muted); }

    .clock { font-family: 'JetBrains Mono', monospace; font-size: clamp(1.2rem, 4vw, 1.5rem); background: #000; padding: 5px 12px; border-radius: 6px; font-weight: 700; min-width: 85px; text-align: center; border: 2px solid transparent; }
    .clock.active { background: #FFF; color: #000; }

    .board-frame { width: 100%; aspect-ratio: 1 / 1; margin: 0 auto; border: 4px solid var(--bg-panel); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; user-select: none; position: relative; }
    .board-grid { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }

    .square { position: relative; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .sq-light { background-color: var(--sq-light); color: var(--sq-dark); }
    .sq-dark { background-color: var(--sq-dark); color: var(--sq-light); }
    .sq-selected::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.4); z-index: 2; pointer-events: none; }
    .sq-last-move::after { content: ''; position: absolute; inset: 0; background: rgba(250,204,21,0.4); z-index: 1; pointer-events: none; }
    .sq-check::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(239,68,68,0.8), transparent); z-index: 1; pointer-events: none; }
    
    .legal-dot { width: 25%; height: 25%; background: rgba(0,0,0,0.2); border-radius: 50%; z-index: 3; pointer-events: none; }
    .legal-capture { width: 80%; height: 80%; border: 5px solid rgba(0,0,0,0.2); border-radius: 50%; z-index: 3; pointer-events: none; }
    .coord-rank { position: absolute; top: 2px; left: 3px; font-size: clamp(8px, 2.5vw, 12px); font-weight: 800; z-index: 2; pointer-events: none; }
    .coord-file { position: absolute; bottom: 0px; right: 3px; font-size: clamp(8px, 2.5vw, 12px); font-weight: 800; z-index: 2; pointer-events: none; }

    .piece-img { width: 90%; height: 90%; object-fit: contain; z-index: 5; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6)); pointer-events: none; }
    .piece-classic { font-size: clamp(2rem, 8vw, 3.5rem); z-index: 5; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

    .sidebar-section { width: 320px; background: var(--bg-panel); border-radius: 8px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); height: 100%; min-height: 400px; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
    .match-info { font-size: 0.85rem; font-weight: 700; color: var(--gold); }
    .btn-leave { background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    
    .history-list { flex: 1; overflow-y: auto; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
    .history-row { display: flex; padding: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .hist-num { width: 30px; color: var(--text-muted); }
    .hist-move { flex: 1; text-align: center; }

    .controls { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
    .btn-ctrl { background: rgba(255,255,255,0.1); border: none; color: #FFF; padding: 12px 5px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-danger { background: rgba(239,68,68,0.2); color: #FCA5A5; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .hidden { display: none !important; }
    .modal-box { background: var(--bg-panel); padding: 30px; border-radius: 12px; text-align: center; border: 1px solid var(--gold); width: 90%; max-width: 400px; }
    .modal-title { font-size: 2rem; color: var(--gold); margin-bottom: 10px; font-weight: 900; }
    .btn-primary { background: var(--green); color: #000; border: none; padding: 14px 20px; font-weight: 900; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; margin-bottom: 10px; }

    .waiting-screen { position: absolute; inset: 0; background: rgba(6, 21, 45, 0.9); z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--gold); font-weight: bold; font-size: 1.2rem; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="arena-layout">
    <div class="board-section">
      <div class="player-bar">
        <div class="player-info">
          <img id="top-avatar" src="" class="player-avatar" alt="Oponente">
          <div class="player-details">
            <span class="player-name" id="top-name">Esperando...</span>
            <span class="player-elo" id="top-elo">--</span>
          </div>
        </div>
        <div class="clock" id="top-clock">10:00</div>
      </div>

      <div class="board-frame">
        <div class="waiting-screen hidden" id="waiting-screen">
          <div class="spinner"></div>
          Buscando oponente en línea...
        </div>
        <div class="board-grid" id="chessboard"></div>
      </div>

      <div class="player-bar">
        <div class="player-info">
          <img id="bottom-avatar" src="" class="player-avatar" alt="Tú">
          <div class="player-details">
            <span class="player-name" id="bottom-name">Cargando...</span>
            <span class="player-elo" id="bottom-elo">Preparando</span>
          </div>
        </div>
        <div class="clock active" id="bottom-clock">10:00</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-header">
        <span class="match-info" id="match-info">SISTEMA INICIANDO</span>
        <button class="btn-leave" onclick="window.location.href='menu.html'">✕ Salir</button>
      </div>
      <div class="history-list" id="history-list"></div>
      <div class="controls">
        <button class="btn-ctrl" id="btn-undo">↩ Deshacer</button>
        <button class="btn-ctrl" id="btn-flip">🔄 Girar</button>
        <button class="btn-ctrl" id="btn-draw">🤝 Tablas</button>
        <button class="btn-ctrl btn-danger" id="btn-resign">🏳 Rendirse</button>
        <button class="btn-ctrl" id="btn-save-pgn" style="grid-column: span 2; background: var(--green); color: #000; display: none;">📥 Descargar Partida</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="gameover-modal">
    <div class="modal-box">
      <h2 class="modal-title" id="gameover-title">Fin del Juego</h2>
      <p id="gameover-desc" style="margin-bottom: 20px;">--</p>
      <button class="btn-primary" onclick="window.location.reload()">Jugar de Nuevo</button>
      <button class="btn-ctrl" style="width: 100%;" onclick="window.location.href='menu.html'">Volver al Menú</button>
    </div>
  </div>

  <script>
    // 1. CARGA DE CONFIGURACIÓN
    let config = JSON.parse(localStorage.getItem('juvenchess_config')) || { mode: 'ia', botId: 'profe', botElo: 200, botName: 'Profe Adrian', timeMinutes: 10, timeIncrement: 0, playerAvatar: 'goyopeon.png', boardTheme: 'gold-blue', pieceStyle: 'png', soundActive: true, showCoords: true, showAssists: true, saveMatch: true };
    const sesion = JSON.parse(sessionStorage.getItem('juvenchess_session'));
    
    document.body.setAttribute('data-theme', config.boardTheme);
    if(config.saveMatch) document.getElementById('btn-save-pgn').style.display = 'block';

    const PIECES_PNG = { w: { p: 'goyopeon.png', n: 'goyocaballo.png', b: 'goyoalfil.png', r: 'goyotorre.png', q: 'goyoreyna.png', k: 'goyorey.png' }, b: { p: 'chemapeon.png', n: 'chemacaballo.png', b: 'chemaalfil.png', r: 'chematorre.png', q: 'chemareyna.png', k: 'chemarey.png' } };
    const PIECES_CLASSIC = { w: { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕', k: '♔' }, b: { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' } };

    // 2. VARIABLES DE JUEGO Y RED
    const game = new Chess();
    let flipped = false; let selectedSq = null; let isGameOver = false;
    let clocks = { w: config.timeMinutes * 60, b: config.timeMinutes * 60, timerId: null, active: config.timeMinutes > 0 };
    let myColor = 'w'; // Por defecto blancas en local
    let ws = null;

    // Configuración Inicial de la Interfaz
    document.getElementById('bottom-avatar').src = config.playerAvatar;
    document.getElementById('bottom-name').textContent = sesion ? sesion.username : 'Jugador Local';
    document.getElementById('bottom-elo').textContent = 'Piezas Blancas';

    const topAvatar = document.getElementById('top-avatar');
    const topName = document.getElementById('top-name');
    const topElo = document.getElementById('top-elo');

    // 3. INICIO DE WEBSOCKETS (Si el modo es online)
    if (config.mode === 'online') {
      document.getElementById('waiting-screen').classList.remove('hidden');
      document.getElementById('btn-undo').disabled = true; // No se puede deshacer en línea
      
      ws = new WebSocket("ws://localhost:8787/ws");

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'join',
          room: 'sala_publica_1',
          username: sesion ? sesion.username : 'Invitado',
          elo: sesion ? sesion.puntuacion : 0
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'start') {
          document.getElementById('waiting-screen').classList.add('hidden');
          
          myColor = data.color;
          flipped = (myColor === 'b');
          
          topName.textContent = data.opponentName;
          topElo.textContent = `Elo: ${data.opponentElo}`;
          topAvatar.src = 'chemapeon.png'; // Avatar por defecto online

          document.getElementById('bottom-elo').textContent = (myColor === 'w') ? 'Piezas Blancas' : 'Piezas Negras';
          document.getElementById('match-info').textContent = `EN LÍNEA • ${config.timeMinutes > 0 ? config.timeMinutes + ' MIN' : 'SIN RELOJ'}`;
          
          startClocks();
          updateAll();
        } 
        
        else if (data.type === 'move') {
          game.move(data.move);
          if (clocks.active) clocks[game.turn() === 'w' ? 'b' : 'w'] += config.timeIncrement;
          playSound(game.in_check() ? 'check' : data.move.captured ? 'capture' : 'move');
          updateAll();
          checkGameStatus();
        }

        else if (data.type === 'opponent_disconnected') {
          endGame(myColor, "El oponente abandonó la partida.");
        }
      };
    } else {
      // Configuración Local (IA o PvP local)
      document.getElementById('match-info').textContent = `${config.mode === 'ia' ? 'VS IA' : 'PvP LOCAL'} • ${config.timeMinutes > 0 ? config.timeMinutes + ' MIN' : 'SIN RELOJ'}`;
      if (config.mode === 'ia') {
        topAvatar.src = config.botImg || 'profe.png'; topName.textContent = config.botName; topElo.textContent = `Elo: ${config.botElo}`;
      } else {
        topAvatar.src = 'chemapeon.png'; topName.textContent = 'Jugador 2'; topElo.textContent = 'Piezas Negras';
      }
      startClocks();
    }

    // 4. MOTOR IA LOCAL
    let stockfishWorker = null;
    if (config.mode === 'ia') {
      try {
        const blob = new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");'], {type: 'application/javascript'});
        stockfishWorker = new Worker(URL.createObjectURL(blob));
        stockfishWorker.postMessage('uci');
        stockfishWorker.postMessage(`setoption name Skill Level value ${config.botElo > 1000 ? 10 : 2}`);
      } catch (e) { console.warn("IA Aleatoria activada"); }
    }

    // 5. FUNCIONES PRINCIPALES
    function renderBoard() {
      const boardEl = document.getElementById('chessboard'); boardEl.innerHTML = '';
      const files = 'abcdefgh';
      const history = game.history({ verbose: true });
      const lastMove = history.length > 0 ? history[history.length - 1] : null;
      const validMoves = selectedSq ? game.moves({ square: selectedSq, verbose: true }) : [];

      for (let i = 0; i < 64; i++) {
        const vR = Math.floor(i / 8); const vC = i % 8;
        const r = flipped ? 7 - vR : vR; const c = flipped ? 7 - vC : vC;
        const sq = files[c] + (8 - r);
        const piece = game.get(sq);
        const isLight = (r + c) % 2 === 0;

        const cell = document.createElement('div');
        cell.className = `square ${isLight ? 'sq-light' : 'sq-dark'}`;
        
        if (config.showCoords) {
          if (vC === 0) cell.innerHTML += `<span class="coord-rank">${8 - r}</span>`;
          if (vR === 7) cell.innerHTML += `<span class="coord-file">${files[c]}</span>`;
        }

        if (selectedSq === sq) cell.classList.add('sq-selected');
        if (lastMove && (lastMove.from === sq || lastMove.to === sq)) cell.classList.add('sq-last-move');
        if (piece && piece.type === 'k' && piece.color === game.turn() && game.in_check()) cell.classList.add('sq-check');

        if (config.showAssists && validMoves.find(m => m.to === sq)) {
          const marker = document.createElement('div');
          marker.className = game.get(sq) ? 'legal-capture' : 'legal-dot';
          cell.appendChild(marker);
        }

        if (piece) {
          if (config.pieceStyle === 'png') {
            const img = document.createElement('img'); img.src = PIECES_PNG[piece.color][piece.type]; img.className = 'piece-img';
            cell.appendChild(img);
          } else {
            const span = document.createElement('span'); span.className = 'piece-classic'; span.textContent = PIECES_CLASSIC[piece.color][piece.type]; span.style.color = piece.color === 'w' ? '#FFF' : '#000';
            cell.appendChild(span);
          }
        }
        cell.onclick = () => onSquareClick(sq);
        boardEl.appendChild(cell);
      }
    }

    function playSound(type) {
      if (!config.soundActive) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = type === 'check' ? 600 : type === 'capture' ? 200 : 350;
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
      o.start(); o.stop(ctx.currentTime + 0.1);
    }

    function onSquareClick(sq) {
      if (isGameOver) return;
      
      // Regla de Turnos: Si es Online, solo puedes mover tu color
      if (config.mode === 'online' && game.turn() !== myColor) return;
      if (config.mode === 'ia' && game.turn() === 'b') return;

      const moves = game.moves({ square: selectedSq, verbose: true });
      const move = moves.find(m => m.to === sq);

      if (move) {
        const moveObj = { from: selectedSq, to: sq, promotion: 'q' };
        game.move(moveObj);
        selectedSq = null;
        
        // Enviar movimiento por red
        if (config.mode === 'online' && ws) {
          ws.send(JSON.stringify({ type: 'move', move: moveObj }));
        }

        if (clocks.active) clocks[game.turn() === 'w' ? 'b' : 'w'] += config.timeIncrement;
        playSound(game.in_check() ? 'check' : move.captured ? 'capture' : 'move');
        updateAll(); checkGameStatus();
        
        if (!isGameOver && config.mode === 'ia') setTimeout(playBotMove, 250);
      } else {
        const piece = game.get(sq);
        selectedSq = (piece && piece.color === game.turn()) ? sq : null;
        renderBoard();
      }
    }

    function playBotMove() {
      if (stockfishWorker) {
        stockfishWorker.onmessage = function(e) {
          if (e.data.startsWith('bestmove')) {
            const best = e.data.split(' ')[1];
            if (best && best !== '(none)') {
              game.move({ from: best.substring(0, 2), to: best.substring(2, 4), promotion: 'q' });
              if (clocks.active) clocks['b'] += config.timeIncrement;
              playSound(game.in_check() ? 'check' : 'move'); updateAll(); checkGameStatus();
            }
          }
        };
        stockfishWorker.postMessage(`position fen ${game.fen()}`); stockfishWorker.postMessage('go movetime 500');
      } else {
        const moves = game.moves();
        if (moves.length > 0) {
          game.move(moves[Math.floor(Math.random() * moves.length)]);
          if (clocks.active) clocks['b'] += config.timeIncrement;
          playSound('move'); updateAll(); checkGameStatus();
        }
      }
    }

    function updateAll() {
      renderBoard();
      const hist = game.history(); let html = '';
      for (let i = 0; i < hist.length; i+=2) html += `<div class="history-row"><div class="hist-num">${(i/2)+1}.</div><div class="hist-move">${hist[i]}</div><div class="hist-move">${hist[i+1] || ''}</div></div>`;
      const listEl = document.getElementById('history-list'); listEl.innerHTML = html; listEl.scrollTop = listEl.scrollHeight;
      document.getElementById('top-clock').classList.toggle('active', game.turn() === (flipped ? 'w' : 'b'));
      document.getElementById('bottom-clock').classList.toggle('active', game.turn() === (flipped ? 'b' : 'w'));
    }

    function startClocks() {
      if (!clocks.active) { document.getElementById('top-clock').textContent = '∞'; document.getElementById('bottom-clock').textContent = '∞'; return; }
      clocks.timerId = setInterval(() => {
        if (isGameOver) return;
        const activeColor = game.turn(); clocks[activeColor] -= 1;
        const formatTime = (s) => `${Math.floor(Math.max(0, s) / 60).toString().padStart(2,'0')}:${(Math.max(0, s) % 60).toString().padStart(2,'0')}`;
        document.getElementById('top-clock').textContent = formatTime(clocks[flipped ? 'w' : 'b']);
        document.getElementById('bottom-clock').textContent = formatTime(clocks[flipped ? 'b' : 'w']);
        if (clocks[activeColor] <= 0) endGame(activeColor === 'w' ? 'b' : 'w', "Tiempo agotado.");
      }, 1000);
    }

    function checkGameStatus() {
      if (game.in_checkmate()) { endGame(game.turn() === 'w' ? 'b' : 'w', "Jaque Mate Oficial"); if(game.turn()==='b' && myColor==='w' || game.turn()==='w' && myColor==='b') confetti({ particleCount: 150, spread: 80 }); }
      else if (game.in_draw()) { endGame('draw', "Tablas (Empate Oficial)"); }
    }

    function endGame(winner, reason) {
      isGameOver = true; clearInterval(clocks.timerId);
      const modal = document.getElementById('gameover-modal'); const title = document.getElementById('gameover-title');
      if (winner === 'draw') { title.textContent = "¡Empate!"; title.style.color = "#94A3B8"; }
      else if (winner === myColor) { title.textContent = "¡Ganaste!"; title.style.color = "#10B981"; }
      else { title.textContent = "¡Derrota!"; title.style.color = "#EF4444"; }
      document.getElementById('gameover-desc').textContent = reason;
      modal.classList.remove('hidden');
    }

    document.getElementById('btn-undo').onclick = () => { if (isGameOver || config.mode === 'online') return; game.undo(); if (config.mode === 'ia' && game.turn() === 'b') game.undo(); selectedSq = null; updateAll(); };
    document.getElementById('btn-flip').onclick = () => { flipped = !flipped; renderBoard(); const t=document.getElementById('top-name'); const b=document.getElementById('bottom-name'); const c=b.textContent; b.textContent=t.textContent; t.textContent=c; };
    document.getElementById('btn-draw').onclick = () => { if(!isGameOver) endGame('draw', 'Mutuo Acuerdo'); };
    document.getElementById('btn-resign').onclick = () => { if(!isGameOver) endGame(game.turn() === 'w' ? 'b' : 'w', 'Rendición'); };
    
    document.getElementById('btn-save-pgn').onclick = () => {
      const pgn = game.pgn(); if(!pgn) return alert("No hay movimientos.");
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([pgn], { type: 'text/plain' }));
      a.download = `Juvenchess_${new Date().getTime()}.pgn`; a.click();
    };

    renderBoard(); updateAll();
  </script>
</body>
</html>
