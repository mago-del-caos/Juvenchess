<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Arena Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        h1 { color: #ffd700; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 1.7rem; text-align: center; }
        
        /* LOBBY */
        #lobbyContainer { width: 100%; max-width: 650px; display: block; }
        .lobby-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .lobby-title { color: #06d6a0; border-bottom: 1px solid #3a506b; padding-bottom: 10px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.15rem; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #3a506b; background: #0b132b; border-radius: 8px; margin-bottom: 8px; }
        .list-item.mi-turno-item { border: 2px solid #06d6a0; box-shadow: 0 0 12px rgba(6, 214, 160, 0.35); }
        
        .btn-crear { background-color: #ff9f1c; color: #0b132b; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; margin-bottom: 15px; transition: 0.3s; }
        .btn-crear:hover { background-color: #e88e15; transform: scale(1.01); }
        .btn-jugar { background-color: #06d6a0; color: #0b132b; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-jugar:hover { background-color: #05b383; }
        .btn-reanudar { background-color: #ffd700; color: #0b132b; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-cancelar-reto { background-color: #d62828; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* ARENA / TABLERO */
        #boardContainer { width: 100%; max-width: 480px; display: none; }
        
        /* BANNER DE AVISO DE MOVIMIENTO */
        #avisoTurnoBanner {
            display: none;
            background: linear-gradient(90deg, #06d6a0, #ffd700);
            color: #0b132b;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(6, 214, 160, 0.7);
            animation: bounceIn 0.4s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .info-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; transition: 0.3s; }
        .info-panel.turno-activo-mio { border-color: #06d6a0; box-shadow: 0 0 15px rgba(6, 214, 160, 0.4); }
        .info-panel.turno-activo-rival { border-color: #ff9f1c; }

        .player-box { display: flex; flex-direction: column; gap: 4px; }
        .clock-badge { background: #0b132b; color: #ffd700; font-family: monospace; font-size: 1.25rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; border: 1px solid #3a506b; display: inline-block; text-align: center; }
        .clock-badge.clock-low { color: #ff4d4d; border-color: #ff4d4d; animation: pulse 1s infinite; }

        .board-wrapper { position: relative; width: 100%; margin-bottom: 10px; }
        #board { width: 100%; border: 4px solid #ffd700; border-radius: 6px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); background-color: #ffffff; box-sizing: border-box; }
        
        /* RESALTADO DEL ÚLTIMO MOVIMIENTO Y JAQUE */
        .highlight-last-move { box-shadow: inset 0 0 0 4px rgba(255, 215, 0, 0.85) !important; background-color: rgba(255, 215, 0, 0.35) !important; }
        .highlight-check { background: radial-gradient(circle, rgba(214,40,40,0.85) 0%, rgba(214,40,40,0) 70%) !important; }

        /* HISTORIAL PGN Y CONTROLES */
        .movimientos-box { background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 0.85rem; color: #9aa5ce; max-height: 60px; overflow-y: auto; font-family: monospace; }
        .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .btn-rendirse { background-color: #d62828; color: white; font-weight: bold; padding: 11px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: 0.3s; }
        .btn-rendirse:hover { background-color: #a81d1d; }
        .btn-volver { background-color: #3a506b; color: white; font-weight: bold; padding: 11px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: 0.3s; width: 100%; }
        .btn-volver:hover { background-color: #2b3d54; }

        .btn-config { position: absolute; top: -12px; right: -12px; background: #06d6a0; color: #0b132b; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        #configModal { display: none; position: absolute; top: 35px; right: 0; background: #1c2541; border: 2px solid #3a506b; border-radius: 8px; padding: 15px; z-index: 101; box-shadow: 0 8px 16px rgba(0,0,0,0.8); min-width: 240px; }
        .config-item { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .config-item select { padding: 5px; border-radius: 4px; background: #0b132b; color: white; border: 1px solid #3a506b; width: 55%; }
        .btn-accion { background: #06d6a0; border: none; padding: 8px; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; color:#0b132b; }

        .board-classic .white-1e1d7 { background-color: #f0d9b5; color: #b58863; }
        .board-classic .black-3c85d { background-color: #b58863; color: #f0d9b5; }
        .board-juven .white-1e1d7 { background-color: #e0e0e0; color: #0b132b; }
        .board-juven .black-3c85d { background-color: #1c2541; color: #e0e0e0; }

        .radar-icon { animation: pulse 2s infinite; color: #06d6a0; font-size: 0.85rem; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
        .error-msg { color: #ff4d4d; font-weight: bold; text-align: center; padding: 10px; border: 1px solid #ff4d4d; border-radius: 5px; background: rgba(255, 77, 77, 0.1); }
    </style>
</head>
<body>

    <h1><i class="fas fa-globe"></i> ARENA ONLINE</h1>
    
    <!-- CONTENEDOR DEL LOBBY -->
    <div id="lobbyContainer">
        <button class="btn-crear" onclick="crearReto()"><i class="fas fa-plus-circle"></i> Crear Nuevo Reto</button>
        
        <div class="lobby-panel" id="panelMisRetos" style="display:none;">
            <h3 class="lobby-title"><span><i class="fas fa-hourglass-half"></i> Mis Retos Creados</span></h3>
            <div id="listaMisRetos"></div>
        </div>

        <div class="lobby-panel">
            <h3 class="lobby-title">
                <span><i class="fas fa-chess-knight"></i> Mis Partidas en Curso</span>
                <span class="radar-icon"><i class="fas fa-sync-alt"></i> En vivo</span>
            </h3>
            <div id="listaActivas"><div style="color: #9aa5ce; text-align: center;">Cargando...</div></div>
        </div>

        <div class="lobby-panel">
            <h3 class="lobby-title">
                <span><i class="fas fa-users"></i> Retos Disponibles</span>
                <span class="radar-icon"><i class="fas fa-satellite-dish"></i> Buscando...</span>
            </h3>
            <div id="listaEspera"><div style="color: #9aa5ce; text-align: center;">Buscando rivales...</div></div>
        </div>

        <button class="btn-volver" onclick="window.location.href='menu.html';"><i class="fas fa-arrow-left"></i> Volver al Menú Principal</button>
    </div>

    <!-- CONTENEDOR DEL TABLERO -->
    <div id="boardContainer">
        <!-- Banner de notificación cuando el rival mueve -->
        <div id="avisoTurnoBanner"><i class="fas fa-bell"></i> ¡Tu rival ha movido! Es tu turno.</div>

        <div class="info-panel" id="infoPanel">
            <div class="player-box">
                <div style="color:#06d6a0; font-weight:bold; font-size:0.9rem;">Tú: <span id="jugadorLocal" style="color:white;">-</span></div>
                <div class="clock-badge" id="relojLocal">05:00</div>
            </div>

            <div style="text-align:center; padding: 0 8px;">
                <div id="estadoJuego" style="color:#ffd700; font-weight:bold; font-size:1.05rem;">Conectando...</div>
                <div id="ultimoMovTexto" style="color:#9aa5ce; font-size:0.8rem; margin-top:3px;">Esperando inicio</div>
            </div>

            <div class="player-box" style="text-align:right;">
                <div style="color:#ff9f1c; font-weight:bold; font-size:0.9rem;">Rival: <span id="jugadorRival" style="color:white;">-</span></div>
                <div class="clock-badge" id="relojRival">05:00</div>
            </div>
        </div>
        
        <div class="board-wrapper">
            <button class="btn-config" onclick="toggleConfig()" title="Ajustes de Tablero"><i class="fas fa-cog"></i></button>
            <div id="configModal">
                <h3 style="margin-top:0; color:#ffd700; border-bottom:1px solid #3a506b; padding-bottom:5px;"><i class="fas fa-sliders-h"></i> Ajustes</h3>
                <div class="config-item">
                    <label>Piezas:</label>
                    <select id="selPiezas" onchange="actualizarAjustes()"><option value="custom">Chema/Goyo</option><option value="classic">Clásicas</option></select>
                </div>
                <div class="config-item">
                    <label>Tablero:</label>
                    <select id="selTablero" onchange="actualizarAjustes()"><option value="board-classic">Madera</option><option value="board-juven">Oscuro</option></select>
                </div>
                <div class="config-item">
                    <label>Sonido:</label>
                    <select id="selSonido"><option value="on">Activado</option><option value="off">Silencio</option></select>
                </div>
                <button class="btn-accion" onclick="toggleConfig()"><i class="fas fa-check"></i> Listo</button>
            </div>
            <div id="board" class="board-classic"></div>
        </div>

        <div class="movimientos-box" id="historialBox">Historial de jugadas aparecerá aquí...</div>

        <div class="action-bar">
            <button class="btn-volver" onclick="salirAlLobby()"><i class="fas fa-door-open"></i> Guardar y Salir</button>
            <button class="btn-rendirse" id="btnRendirse" onclick="rendirse()"><i class="fas fa-flag"></i> Rendirse</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

    <script>
        const API_URL = 'https://juvenchess-api.adrian-camelot32.workers.dev';
        const username = localStorage.getItem('username');
        if(!username) window.location.href = 'index.html';

        let partidaId = null;
        let miColor = 'w';
        let pollingInterval = null;      
        let lobbyInterval = null;
        let timerInterval = null;
        let titleBlinkInterval = null;

        let tiempoBlancas = 300;
        let tiempoNegras = 300;
        let estadoPartidaActual = 'esperando';
        let ultimoFenRecibido = '';
        let ultimoMovRegistrado = '';

        var configPiezas = 'custom';
        var board = null;
        var game = new Chess();

        // --- SISTEMA DE SONIDO SINTETIZADO (SIN ARCHIVOS EXTERNOS) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(tipo) {
            if (document.getElementById('selSonido') && document.getElementById('selSonido').value === 'off') return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const ahora = audioCtx.currentTime;
                if (tipo === 'mover') {
                    osc.frequency.setValueAtTime(440, ahora);
                    osc.frequency.exponentialRampToValueAtTime(587.33, ahora + 0.08);
                    gain.gain.setValueAtTime(0.18, ahora);
                    gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.1);
                    osc.start(ahora); osc.stop(ahora + 0.1);
                } else if (tipo === 'alertaRival') {
                    // Doble tono claro para avisar que el rival movió
                    osc.frequency.setValueAtTime(523.25, ahora); // Do
                    osc.frequency.setValueAtTime(659.25, ahora + 0.12); // Mi
                    gain.gain.setValueAtTime(0.25, ahora);
                    gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.28);
                    osc.start(ahora); osc.stop(ahora + 0.28);
                } else if (tipo === 'jaque') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ahora);
                    osc.frequency.setValueAtTime(220, ahora + 0.15);
                    gain.gain.setValueAtTime(0.25, ahora);
                    gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.35);
                    osc.start(ahora); osc.stop(ahora + 0.35);
                } else if (tipo === 'fin') {
                    osc.frequency.setValueAtTime(392, ahora);
                    osc.frequency.setValueAtTime(523.25, ahora + 0.15);
                    osc.frequency.setValueAtTime(659.25, ahora + 0.3);
                    gain.gain.setValueAtTime(0.3, ahora);
                    gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.5);
                    osc.start(ahora); osc.stop(ahora + 0.5);
                }
            } catch (e) {}
        }

        // --- PARPADEO DE PESTAÑA CUANDO EL RIVAL MUEVE ---
        window.addEventListener('focus', detenerParpadeoTitulo);
        function iniciarParpadeoTitulo(mensaje) {
            detenerParpadeoTitulo();
            let flag = false;
            titleBlinkInterval = setInterval(() => {
                document.title = flag ? `🔔 ${mensaje}` : 'JUVENCHESS | Arena Online';
                flag = !flag;
            }, 1000);
        }
        function detenerParpadeoTitulo() {
            if (titleBlinkInterval) {
                clearInterval(titleBlinkInterval);
                titleBlinkInterval = null;
                document.title = 'JUVENCHESS | Arena Online';
            }
        }

        // --- FUNCIONES DEL LOBBY ---
        async function cargarLobby() {
            try {
                const res = await fetch(`${API_URL}/online/lobby?user=${username}&t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.error) return;

                // 1. Mis Retos en Espera
                const misRetos = data.misRetos || [];
                const panelMisRetos = document.getElementById('panelMisRetos');
                if (misRetos.length > 0) {
                    panelMisRetos.style.display = 'block';
                    let htmlMisRetos = '';
                    misRetos.forEach(p => {
                        let min = Math.round((p.tiempo || 300) / 60);
                        htmlMisRetos += `
                            <div class="list-item">
                                <div><i class="fas fa-spinner fa-spin" style="color:#ffd700;"></i> Esperando oponente (${min} min)</div>
                                <div style="display:flex; gap:6px;">
                                    <button class="btn-jugar" onclick="entrarSalaEspera('${p.id}', '${p.color_creador}', ${p.tiempo || 300})">Abrir Tablero</button>
                                    <button class="btn-cancelar-reto" onclick="cancelarMiReto('${p.id}')"><i class="fas fa-times"></i></button>
                                </div>
                            </div>`;
                    });
                    document.getElementById('listaMisRetos').innerHTML = htmlMisRetos;
                } else {
                    panelMisRetos.style.display = 'none';
                }

                // 2. Retos Disponibles de otros jugadores
                const esperando = data.esperando || [];
                let htmlEspera = '';
                if(esperando.length === 0) {
                    htmlEspera = '<div style="color: #9aa5ce; text-align: center;">Nadie está buscando partida en este momento. ¡Crea un reto!</div>';
                } else {
                    esperando.forEach(p => {
                        let tiempo = Math.round((p.tiempo || 300) / 60);
                        let juegaCon = p.color_creador === 'w' ? 'Negras' : 'Blancas'; 
                        htmlEspera += `
                            <div class="list-item">
                                <div><i class="fas fa-user"></i> <b>${p.creador}</b> <br> <small style="color:#06d6a0;">⏱️ ${tiempo} min | Juegas con: ${juegaCon}</small></div>
                                <button class="btn-jugar" onclick="unirseReto('${p.id}', '${p.color_creador}', '${p.creador}')"><i class="fas fa-play"></i> Aceptar Reto</button>
                            </div>`;
                    });
                }
                document.getElementById('listaEspera').innerHTML = htmlEspera;

                // 3. Partidas Activas (con aviso si es tu turno)
                const activas = data.activas || [];
                let htmlActivas = '';
                if(activas.length === 0) {
                    htmlActivas = '<div style="color: #9aa5ce; text-align: center;">No tienes partidas en curso.</div>';
                } else {
                    activas.forEach(p => {
                        let rival = p.creador.toLowerCase() === username.toLowerCase() ? p.oponente : p.creador;
                        let micolor = p.creador.toLowerCase() === username.toLowerCase() ? p.color_creador : (p.color_creador === 'w' ? 'b' : 'w');
                        let turnoFen = (p.fen && p.fen.split(' ')[1]) ? p.fen.split(' ')[1] : 'w';
                        let esMiTurno = (turnoFen === micolor);

                        let badgeTurno = esMiTurno 
                            ? `<span style="color:#06d6a0; font-weight:bold;"><i class="fas fa-bell"></i> ¡ES TU TURNO!</span>`
                            : `<span style="color:#9aa5ce;">Esperando a ${rival}...</span>`;

                        htmlActivas += `
                            <div class="list-item ${esMiTurno ? 'mi-turno-item' : ''}">
                                <div>
                                    <i class="fas fa-chess-knight"></i> vs <b>${rival}</b><br>
                                    <small>${badgeTurno} ${p.ultimo_mov ? `| Última: ${p.ultimo_mov}` : ''}</small>
                                </div>
                                <button class="btn-reanudar" onclick="reanudarPartida('${p.id}', '${micolor}', '${p.creador}', '${p.oponente}')"><i class="fas fa-play-circle"></i> Entrar</button>
                            </div>`;
                    });
                }
                document.getElementById('listaActivas').innerHTML = htmlActivas;

            } catch(e) {}
        }

        function activarRadarLobby() { if (!lobbyInterval) lobbyInterval = setInterval(cargarLobby, 3000); }
        function desactivarRadarLobby() { if (lobbyInterval) { clearInterval(lobbyInterval); lobbyInterval = null; } }

        async function crearReto() {
            const { value: formValues } = await Swal.fire({
                title: 'Configurar Reto',
                html: `<select id="swal-tiempo" class="swal2-select" style="width: 85%; background:#0b132b; color:white; border:1px solid #3a506b;"><option value="180">Blitz (3 min)</option><option value="300" selected>Blitz (5 min)</option><option value="600">Rápido (10 min)</option><option value="1800">Clásico (30 min)</option></select>
                       <select id="swal-color" class="swal2-select" style="width: 85%; background:#0b132b; color:white; border:1px solid #3a506b;"><option value="w">Jugar con Blancas</option><option value="b">Jugar con Negras</option></select>`,
                focusConfirm: false, background: '#1c2541', color: '#fff', confirmButtonColor: '#ff9f1c', confirmButtonText: 'Crear Reto', showCancelButton: true,
                preConfirm: () => { return { tiempo: document.getElementById('swal-tiempo').value, color: document.getElementById('swal-color').value } }
            });

            if (formValues) {
                const res = await fetch(`${API_URL}/online/crear`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, tiempo: formValues.tiempo, color: formValues.color })
                });
                if (!res.ok) return Swal.fire('Error', 'No se pudo crear el reto', 'error');
                const data = await res.json();
                entrarSalaEspera(data.id, formValues.color, parseInt(formValues.tiempo));
            }
        }

        function entrarSalaEspera(id, color, segundos) {
            partidaId = id;
            miColor = color;
            tiempoBlancas = segundos;
            tiempoNegras = segundos;
            game.reset();
            ultimoFenRecibido = game.fen();
            prepararTablero("Esperando...", "Esperando rival...");
        }

        async function cancelarMiReto(id) {
            await fetch(`${API_URL}/online/cancelar`, {
                method: 'DELETE', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });
            cargarLobby();
        }

        async function unirseReto(id, colorCreador, nombreCreador) {
            partidaId = id;
            miColor = colorCreador === 'w' ? 'b' : 'w';
            await fetch(`${API_URL}/online/unirse`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: partidaId, username: username })
            });
            game.reset();
            ultimoFenRecibido = '';
            prepararTablero(nombreCreador, "¡Partida Iniciada!");
        }

        function reanudarPartida(id, color, creador, oponente) {
            partidaId = id;
            miColor = color;
            let rival = creador.toLowerCase() === username.toLowerCase() ? oponente : creador;
            ultimoFenRecibido = '';
            prepararTablero(rival, "Sincronizando...");
        }

        // --- TABLERO Y RELOJES ---
        function formatearTiempo(segundos) {
            const s = Math.max(0, Math.floor(segundos));
            const min = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${min}:${sec}`;
        }

        function actualizarRelojesUI() {
            const miTiempo = miColor === 'w' ? tiempoBlancas : tiempoNegras;
            const rivalTiempo = miColor === 'w' ? tiempoNegras : tiempoBlancas;

            const elLocal = document.getElementById('relojLocal');
            const elRival = document.getElementById('relojRival');

            elLocal.innerText = formatearTiempo(miTiempo);
            elRival.innerText = formatearTiempo(rivalTiempo);

            elLocal.classList.toggle('clock-low', miTiempo <= 30);
            elRival.classList.toggle('clock-low', rivalTiempo <= 30);
        }

        function iniciarRelojLocal() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (estadoPartidaActual !== 'jugando' || game.game_over()) return;
                if (game.turn() === 'w') {
                    tiempoBlancas = Math.max(0, tiempoBlancas - 1);
                    if (tiempoBlancas === 0 && miColor === 'w') reportarFinDePartida(document.getElementById('jugadorRival').innerText, 'Tiempo agotado');
                } else {
                    tiempoNegras = Math.max(0, tiempoNegras - 1);
                    if (tiempoNegras === 0 && miColor === 'b') reportarFinDePartida(document.getElementById('jugadorRival').innerText, 'Tiempo agotado');
                }
                actualizarRelojesUI();
            }, 1000);
        }

        function resaltarCasillas(ultimoMovStr) {
            $('#board .square-55d63').removeClass('highlight-last-move highlight-check');
            if (ultimoMovStr && ultimoMovStr.includes('-')) {
                const partes = ultimoMovStr.split(' ')[0].split('-');
                if (partes.length === 2) {
                    $(`#board .square-${partes[0]}`).addClass('highlight-last-move');
                    $(`#board .square-${partes[1]}`).addClass('highlight-last-move');
                }
            }
            // Si hay jaque, resaltar el rey en rojo
            if (game.in_check()) {
                const turnoActual = game.turn();
                const boardState = game.board();
                const cols = ['a','b','c','d','e','f','g','h'];
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const pieza = boardState[r][c];
                        if (pieza && pieza.type === 'k' && pieza.color === turnoActual) {
                            const sq = cols[c] + (8 - r);
                            $(`#board .square-${sq}`).addClass('highlight-check');
                        }
                    }
                }
            }
        }

        function mostrarAvisoRivalMovio(jugadaTexto) {
            const banner = document.getElementById('avisoTurnoBanner');
            banner.innerHTML = `<i class="fas fa-bell"></i> ¡Tu rival jugó <b>${jugadaTexto || ''}</b>! Es tu turno.`;
            banner.style.display = 'block';
            if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
            if (document.hidden) iniciarParpadeoTitulo('¡Tu turno en Juvenchess!');
            setTimeout(() => { banner.style.display = 'none'; }, 5000);
        }

        function prepararTablero(nombreRival, estadoText) {
            desactivarRadarLobby();
            document.getElementById('lobbyContainer').style.display = 'none';
            document.getElementById('boardContainer').style.display = 'block';
            
            document.getElementById('jugadorLocal').innerText = username;
            document.getElementById('jugadorRival').innerText = nombreRival;
            document.getElementById('estadoJuego').innerText = estadoText;

            var config = {
                draggable: true,
                position: 'start',
                pieceTheme: pieceTheme,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);
            board.orientation(miColor === 'w' ? 'white' : 'black');
            board.position(game.fen());

            actualizarRelojesUI();
            iniciarRelojLocal();
            monitorearPartida();
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(monitorearPartida, 1500);
        }

        function salirAlLobby() {
            if (pollingInterval) clearInterval(pollingInterval);
            if (timerInterval) clearInterval(timerInterval);
            detenerParpadeoTitulo();
            document.getElementById('boardContainer').style.display = 'none';
            document.getElementById('lobbyContainer').style.display = 'block';
            cargarLobby();
            activarRadarLobby(); 
        }

        // --- SINCRONIZACIÓN EN TIEMPO REAL ---
        async function monitorearPartida() {
            try {
                const res = await fetch(`${API_URL}/online/estado?id=${partidaId}&t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();
                if (!data || data.error) return;

                estadoPartidaActual = data.estado;

                if (data.estado === 'esperando') {
                    document.getElementById('estadoJuego').innerText = "Esperando oponente...";
                    document.getElementById('ultimoMovTexto').innerText = "Sala abierta";
                    return;
                }

                const nombreRival = miColor === 'w' ? data.oponente : data.creador;
                document.getElementById('jugadorRival').innerText = nombreRival || 'Rival';

                if (typeof data.tiempo_blancas === 'number') tiempoBlancas = data.tiempo_blancas;
                if (typeof data.tiempo_negras === 'number') tiempoNegras = data.tiempo_negras;
                actualizarRelojesUI();

                // Detectar si hubo un movimiento nuevo en el servidor
                if (data.fen && data.fen !== ultimoFenRecibido) {
                    const eraPrimeraCarga = (ultimoFenRecibido === '');
                    ultimoFenRecibido = data.fen;
                    ultimoMovRegistrado = data.ultimo_mov || '';

                    game.load(data.fen);
                    board.position(game.fen());
                    resaltarCasillas(ultimoMovRegistrado);

                    if (data.pgn) {
                        document.getElementById('historialBox').innerText = data.pgn;
                    } else if (ultimoMovRegistrado) {
                        document.getElementById('historialBox').innerText = `Última jugada: ${ultimoMovRegistrado}`;
                    }

                    // Si el turno ahora es mío y no es la carga inicial, avisar que el rival acaba de mover
                    if (!eraPrimeraCarga && game.turn() === miColor && data.estado === 'jugando') {
                        if (game.in_check()) reproducirSonido('jaque');
                        else reproducirSonido('alertaRival');
                        mostrarAvisoRivalMovio(ultimoMovRegistrado);
                    }
                }

                if (ultimoMovRegistrado) {
                    document.getElementById('ultimoMovTexto').innerText = `Última: ${ultimoMovRegistrado}`;
                }

                // Verificar si la partida ya finalizó en el servidor
                if (data.estado === 'finalizada') {
                    clearInterval(pollingInterval);
                    clearInterval(timerInterval);
                    reproducirSonido('fin');
                    const ganoYo = data.ganador && data.ganador.toLowerCase() === username.toLowerCase();
                    const titulo = data.ganador === 'empate' ? '¡Tablas / Empate!' : (ganoYo ? '🏆 ¡Victoria!' : 'Partida Finalizada');
                    const texto = data.ganador === 'empate' 
                        ? `Motivo: ${data.motivo_fin}` 
                        : `Ganador: ${data.ganador} (${data.motivo_fin}). ${ganoYo ? '(+15 ELO)' : '(-10 ELO)'}`;
                    
                    document.getElementById('estadoJuego').innerText = titulo;
                    Swal.fire({ title: titulo, text: texto, icon: ganoYo ? 'success' : 'info', background: '#1c2541', color: '#fff' });
                    return;
                }

                // Actualizar indicador visual de turno
                const panel = document.getElementById('infoPanel');
                if (game.turn() === miColor) {
                    document.getElementById('estadoJuego').innerHTML = game.in_check() ? '⚠️ ¡JAQUE! Tu Turno' : '🟢 ¡Tu Turno!';
                    panel.classList.add('turno-activo-mio');
                    panel.classList.remove('turno-activo-rival');
                } else {
                    document.getElementById('estadoJuego').innerHTML = '⏳ Turno de ' + (nombreRival || 'Rival');
                    panel.classList.add('turno-activo-rival');
                    panel.classList.remove('turno-activo-mio');
                }

            } catch(e) {}
        }

        // --- REALIZAR MOVIMIENTO ---
        async function onDrop(source, target) {
            if (estadoPartidaActual !== 'jugando' || game.turn() !== miColor) return 'snapback';

            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            detenerParpadeoTitulo();
            document.getElementById('avisoTurnoBanner').style.display = 'none';
            reproducirSonido(game.in_check() ? 'jaque' : 'mover');

            const etiquetaMov = `${source}-${target} (${move.san})`;
            ultimoFenRecibido = game.fen();
            ultimoMovRegistrado = etiquetaMov;
            resaltarCasillas(etiquetaMov);

            document.getElementById('estadoJuego').innerText = "Enviando jugada...";
            document.getElementById('ultimoMovTexto').innerText = `Última: ${etiquetaMov}`;

            await fetch(`${API_URL}/online/mover`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: partidaId,
                    fen: game.fen(),
                    pgn: game.pgn(),
                    ultimo_mov: etiquetaMov,
                    tiempo_blancas: tiempoBlancas,
                    tiempo_negras: tiempoNegras
                })
            });

            // Comprobar si este movimiento terminó la partida
            if (game.in_checkmate()) {
                await reportarFinDePartida(username, 'Jaque Mate');
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                await reportarFinDePartida('empate', 'Tablas reglamentarias');
            } else {
                monitorearPartida();
            }
        }

        async function reportarFinDePartida(ganador, motivo) {
            await fetch(`${API_URL}/online/finalizar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: partidaId, ganador: ganador, motivo: motivo })
            });
            monitorearPartida();
        }

        async function rendirse() {
            if (estadoPartidaActual !== 'jugando') return salirAlLobby();
            const rival = document.getElementById('jugadorRival').innerText;
            const confirmacion = await Swal.fire({
                title: '¿Rendirse?',
                text: `Se le otorgará la victoria a ${rival} y perderás 10 puntos de ELO.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d62828',
                cancelButtonColor: '#3a506b',
                confirmButtonText: 'Sí, me rindo',
                cancelButtonText: 'Seguir jugando',
                background: '#1c2541',
                color: '#fff'
            });

            if (confirmacion.isConfirmed) {
                await reportarFinDePartida(rival, 'Rendición');
            }
        }

        function onDragStart(source, piece) {
            if (estadoPartidaActual !== 'jugando' || game.game_over() || game.turn() !== miColor) return false;
            if ((miColor === 'w' && piece.search(/^b/) !== -1) || (miColor === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onSnapEnd() { board.position(game.fen()); }

        function toggleConfig() {
            const modal = document.getElementById('configModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function actualizarAjustes() {
            configPiezas = document.getElementById('selPiezas').value;
            $('#board').removeClass('board-classic board-juven');
            $('#board').addClass(document.getElementById('selTablero').value);
            board.position(game.fen());
            resaltarCasillas(ultimoMovRegistrado);
        }

        function pieceTheme(piece) {
            if (configPiezas === 'classic') return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
            const customPieces = { 'wP': 'chemapeon.png', 'wN': 'chemacaballo.png', 'wB': 'chemaalfil.png', 'wR': 'chematorre.png', 'wQ': 'chemareyna.png', 'wK': 'chemarey.png', 'bP': 'goyopeon.png', 'bN': 'goyocaballo.png', 'bB': 'goyoalfil.png', 'bR': 'goyotorre.png', 'bQ': 'goyoreina.png', 'bK': 'goyorey.png' };
            return customPieces[piece];
        }

        cargarLobby();
        activarRadarLobby();
    </script>
</body>
</html>
