<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Arena Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        h1 { color: #ffd700; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 1.8rem; }
        
        .info-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 450px; box-sizing: border-box; }
        
        .board-wrapper { position: relative; width: 100%; max-width: 450px; margin-bottom: 10px; }
        #board { width: 100%; border: 4px solid #ffd700; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); background-color: #ffffff; }
        
        .board-juven .white-1e1d7 { background-color: #e0e0e0; color: #0b132b; }
        .board-juven .black-3c85d { background-color: #1c2541; color: #e0e0e0; }

        .btn-volver { background-color: #d62828; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 450px; font-size: 1.1rem; margin-top: 10px;}
        
        /* Pantalla de Carga */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 19, 43, 0.95); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 8px solid #1c2541; border-top: 8px solid #06d6a0; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Pantalla de Búsqueda de Partida -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: #ffd700;">Conectando al Servidor...</h2>
        <p id="loaderText" style="color: #06d6a0;">Buscando rival disponible</p>
        <button class="btn-volver" style="width: auto; margin-top: 30px;" onclick="window.location.href='menu.html'">Cancelar</button>
    </div>

    <h1><i class="fas fa-globe"></i> ARENA ONLINE</h1>
    
    <div class="info-panel">
        <div style="color:#06d6a0; font-weight:bold;">Tú:<br><span id="jugadorLocal" style="color:white;">-</span></div>
        <div style="text-align:center; color:#ffd700; font-weight:bold;" id="estadoJuego">Conectando...</div>
        <div style="color:#d62828; font-weight:bold; text-align:right;">Rival:<br><span id="jugadorRival" style="color:white;">-</span></div>
    </div>
    
    <div class="board-wrapper">
        <div id="board" class="board-juven"></div>
    </div>

    <button class="btn-volver" onclick="window.location.href='menu.html';"><i class="fas fa-arrow-left"></i> Salir de la Partida</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        const API_URL = 'https://juvenchess-api.adrian-camelot32.workers.dev';
        const username = localStorage.getItem('username') || 'INVITADO';
        
        let partidaId = null;
        let miColor = 'w'; // w o b
        let pollingInterval = null;

        var board = null;
        var game = new Chess();

        function pieceTheme(piece) {
            const customPieces = {
                'wP': 'chemapeon.png', 'wN': 'chemacaballo.png', 'wB': 'chemaalfil.png', 'wR': 'chematorre.png', 'wQ': 'chemareyna.png', 'wK': 'chemarey.png',
                'bP': 'goyopeon.png', 'bN': 'goyocaballo.png', 'bB': 'goyoalfil.png', 'bR': 'goyotorre.png', 'bQ': 'goyoreina.png', 'bK': 'goyorey.png'
            };
            return customPieces[piece];
        }

        // 1. BUSCAR O CREAR PARTIDA
        async function buscarPartida() {
            try {
                const res = await fetch(`${API_URL}/online/buscar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await res.json();
                
                partidaId = data.id;
                miColor = data.color;
                
                // Rotar el tablero si somos negras
                board.orientation(miColor === 'w' ? 'white' : 'black');
                
                // Iniciar el monitoreo
                pollingInterval = setInterval(monitorearPartida, 1500);

            } catch(e) {
                document.getElementById('loaderText').innerText = "Error de conexión. Intenta de nuevo.";
            }
        }

        // 2. MONITOREAR ESTADO (POLLING)
        async function monitorearPartida() {
            try {
                const res = await fetch(`${API_URL}/online/estado?id=${partidaId}`);
                const data = await res.json();
                
                if (data.estado === 'esperando') {
                    document.getElementById('loaderText').innerText = "Sala creada. Esperando a que un rival se conecte...";
                } else if (data.estado === 'jugando') {
                    // Ocultar pantalla de carga
                    document.getElementById('loader').style.display = 'none';
                    
                    // Mostrar nombres
                    document.getElementById('jugadorLocal').innerText = miColor === 'w' ? data.jugador_blancas : data.jugador_negras;
                    document.getElementById('jugadorRival').innerText = miColor === 'w' ? data.jugador_negras : data.jugador_blancas;
                    
                    // Sincronizar FEN si el rival movió
                    if (data.fen !== game.fen()) {
                        game.load(data.fen);
                        board.position(game.fen());
                    }

                    actualizarEstadoUI();
                }
            } catch(e) {
                console.log("Esperando respuesta del servidor...");
            }
        }

        // 3. MOVER PIEZA Y ENVIAR AL SERVIDOR
        async function onDrop(source, target) {
            // Validar que sea mi turno y mi color
            if (game.turn() !== miColor) return 'snapback';

            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            actualizarEstadoUI();

            // Enviar movimiento al servidor
            await fetch(`${API_URL}/online/mover`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: partidaId, fen: game.fen() })
            });
        }

        function onDragStart(source, piece) {
            // Solo permitir mover si el juego empezó y es mi turno
            if (game.game_over() || game.turn() !== miColor) return false;
            // Solo puedo mover mis propias piezas
            if ((miColor === 'w' && piece.search(/^b/) !== -1) || (miColor === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function actualizarEstadoUI() {
            if (game.in_checkmate()) {
                document.getElementById('estadoJuego').innerText = '¡Jaque Mate!';
            } else {
                document.getElementById('estadoJuego').innerText = game.turn() === miColor ? "¡Tu Turno!" : "Turno del Rival";
            }
        }

        var config = {
            draggable: true, position: 'start', pieceTheme: pieceTheme,
            onDragStart: onDragStart, onDrop: onDrop, onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('board', config);
        
        // Iniciar búsqueda al abrir la página
        buscarPartida();
    </script>
</body>
</html>
