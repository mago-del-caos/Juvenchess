<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Panel de Control</title>
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 12px; padding: 20px; width: 100%; max-width: 800px; margin-bottom: 20px; }
        h2 { color: #06d6a0; border-bottom: 1px solid #3a506b; padding-bottom: 10px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #3a506b; background-color: #0b132b; color: white; box-sizing: border-box; }
        button { background-color: #06d6a0; color: #0b132b; font-weight: bold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background-color: #05b383; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #3a506b; }
        th { color: #ffd700; }
        .btn-salir { background-color: #d62828; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>PANEL DE CONTROL - DIRECTOR</h1>

    <div class="panel">
        <h2>Crear Nuevo Alumno/Usuario</h2>
        <input type="text" id="newUsername" placeholder="Nombre de usuario">
        <input type="text" id="newPassword" placeholder="Contraseña">
        <select id="newRol">
            <option value="jugador">Jugador</option>
            <option value="admin">Administrador</option>
        </select>
        <button onclick="crearUsuario()">Registrar Usuario</button>
    </div>

    <div class="panel">
        <h2>Crear Torneo</h2>
        <input type="text" id="torneoNombre" placeholder="Nombre del Torneo (Ej: Torneo Interno FES)">
        <input type="date" id="torneoFecha">
        <button onclick="crearTorneo()">Abrir Torneo</button>
    </div>

    <div class="panel">
        <h2>Ranking y Puntuaciones (Elo)</h2>
        <button onclick="cargarUsuarios()">Actualizar Tabla</button>
        <table>
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Elo</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios"></tbody>
        </table>
    </div>

    <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>

    <script>
        const API_URL = 'https://juvenchess-api.adrian-camelot32.workers.dev';

        async function crearUsuario() {
            const user = document.getElementById('newUsername').value;
            const pass = document.getElementById('newPassword').value;
            const rol = document.getElementById('newRol').value;
            
            if(!user || !pass) {
                alert("Por favor, llena tanto el nombre de usuario como la contraseña.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/admin/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass, rol: rol })
                });
                const data = await res.json();

                if(res.ok) {
                    alert('¡Usuario creado exitosamente con 1000 de Elo inicial!');
                    // Limpiamos las casillas automáticamente
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    cargarUsuarios(); // Actualizamos la tabla
                } else {
                    alert('⚠️ Error al crear: ' + data.error);
                }
            } catch(e) {
                alert('⚠️ Error de red al intentar conectar con la base de datos.');
            }
        }

        async function crearTorneo() {
            const nombre = document.getElementById('torneoNombre').value;
            const fecha = document.getElementById('torneoFecha').value;
            if(!nombre || !fecha) return alert("Llena los datos del torneo");

            try {
                await fetch(`${API_URL}/admin/torneos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre, fecha: fecha })
                });
                alert('¡Torneo creado exitosamente!');
                document.getElementById('torneoNombre').value = '';
            } catch(e) {
                alert('Error al crear torneo.');
            }
        }

        async function cargarUsuarios() {
            try {
                const res = await fetch(`${API_URL}/admin/usuarios`);
                const usuarios = await res.json();
                const tbody = document.getElementById('tablaUsuarios');
                tbody.innerHTML = '';
                
                usuarios.forEach(u => {
                    tbody.innerHTML += `<tr>
                        <td>${u.username}</td>
                        <td>${u.rol}</td>
                        <td style="color:#06d6a0; font-weight:bold;">${u.puntuacion}</td>
                    </tr>`;
                });
            } catch(e) {
                console.log("No se pudo cargar la tabla de usuarios.");
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Cargar tabla automáticamente al entrar
        cargarUsuarios();
    </script>
</body>
</html>
