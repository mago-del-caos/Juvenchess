<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Arena Multijugador</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        h2 {
            color: #ffd700;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        .btn-volver {
            background-color: #3a506b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-volver:hover {
            background-color: #06d6a0;
            color: #0b132b;
        }
        .game-container {
            background-color: #1c2541;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #3a506b;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .player-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #06d6a0;
            padding: 10px 0;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 4px solid #0b132b;
            border-radius: 4px;
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem; /* Tamaño para las piezas */
            cursor: pointer;
            user-select: none;
        }
        /* Colores clásicos de tablero con toque moderno */
        .light { background-color: #ebecd0; color: #000; }
        .dark { background-color: #739552; color: #fff; }
        
        /* Efecto al seleccionar una casilla */
        .square:hover { opacity: 0.8; }
        .selected { background-color: #f6f669 !important; }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-volver" onclick="window.location.href='index.html'">⬅ Menú</button>
        <h2>JUVENCHESS</h2>
    </div>

    <div class="game-container">
        <!-- Oponente (Arriba) -->
        <div class="player-info">
            <span id="oponenteNombre">🤖 Oponente (Profe)</span>
            <span>Elo: 200</span>
        </div>

        <!-- Tablero de Ajedrez -->
        <div class="board" id="chessboard"></div>

        <!-- Jugador Local (Abajo) -->
        <div class="player-info">
            <span id="jugadorNombre">👤 Cargando...</span>
            <span>Elo: 1000</span>
        </div>
    </div>

    <script>
        // Recuperar el nombre del usuario desde el almacenamiento local
        const username = localStorage.getItem('username') || 'INVITADO_79';
        document.getElementById('jugadorNombre').innerHTML = `👤 ${username}`;

        // Generar el tablero visual de 64 casillas
        const board = document.getElementById('chessboard');
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                square.classList.add('square');
                
                // Asignar ID basado en coordenadas de ajedrez (a8, b8, etc.)
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                square.id = `${file}${rank}`;

                // Alternar colores claro/oscuro
                if ((row + col) % 2 === 0) {
                    square.classList.add('light');
                } else {
                    square.classList.add('dark');
                }

                // Efecto visual de clic (para pruebas)
                square.addEventListener('click', function() {
                    document.querySelectorAll('.square').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                });

                board.appendChild(square);
            }
        }

        // NOTA PARA CIFRA: Aquí es donde tu lógica en JavaScript insertará 
        // las piezas (&#9812; &#9817; etc.) dentro de cada 'square' usando su ID.
    </script>
</body>
</html>
