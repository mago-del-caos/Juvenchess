<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Tablero Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        h1 { color: #ffd700; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 1.8rem; }
        
        /* Panel de Jugadores y Relojes */
        .info-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 450px; box-sizing: border-box; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #06d6a0; object-fit: cover; margin-right: 10px; vertical-align: middle; }
        .player-info { display: flex; align-items: center; font-weight: bold; }
        
        /* Estilo de los Relojes */
        .clocks { display: flex; flex-direction: column; align-items: flex-end; font-family: monospace; font-size: 1.2rem; }
        .clock { padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 2px; }
        .clock-active { background-color: #06d6a0; color: #0b132b; box-shadow: 0 0 8px #06d6a0; }
        .clock-inactive { background-color: #3a506b; color: #9aa5ce; }

        /* Contenedor del tablero y engranaje */
        .board-wrapper { position: relative; width: 100%; max-width: 450px; margin-bottom: 10px; }
        #board { width: 100%; border: 4px solid #ffd700; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); background-color: #ffffff; }
        
        .btn-config { position: absolute; top: -15px; right: -15px; background: #06d6a0; color: #0b132b; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .btn-config:hover { background: #05b383; }

        /* Modal de configuración */
        #configModal { display: none; position: absolute; top: 30px; right: 0; background: #1c2541; border: 2px solid #3a506b; border-radius: 8px; padding: 15px; z-index: 101; box-shadow: 0 8px 16px rgba(0,0,0,0.8); min-width: 220px; }
        .config-item { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .config-item select { padding: 5px; border-radius: 4px; background: #0b132b; color: white; border: 1px solid #3a506b; width: 60%; }

        /* Historial de Movimientos */
        .history-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 8px; width: 100%; max-width: 450px; height: 100px; overflow-y: auto; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
        .history-panel h3 { margin: 0 0 5px 0; color: #06d6a0; font-size: 1rem; border-bottom: 1px solid #3a506b; padding-bottom: 3px; }
        .history-list { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 5px; font-size: 0.9rem; color: #e0e0e0; font-family: monospace; }
        
        /* Resaltado de movimientos y Temas */
        .highlight1-32417, .highlight2-9c5d2 { box-shadow: inset 0 0 3px 3px yellow; }
        .board-classic .white-1e1d7 { background-color: #f0d9b5; color: #b58863; }
        .board-classic .black-3c85d { background-color: #b58863; color: #f0d9b5; }
        .board-juven .white-1e1d7 { background-color: #e0e0e0; color: #0b132b; }
        .board-juven .black-3c85d { background-color: #1c2541; color: #e0e0e0; }

        .btn-volver { background-color: #d62828; color: white; font-weight: bold; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 450px; }
    </style>
</head>
<body>

    <h1>JUVENCHESS</h1>
    
    <div class="info-panel">
        <div class="player-info">
            <img src="profe.png" alt="Avatar" class="avatar" id="avatarImg" onerror="this.src='zapata.png'">
            <div style="line-height: 1.2;">
                <span style="color:#06d6a0;">Jugador:</span><br>
                <span id="nombreJugador" style="color:white;">Invitado</span>
            </div>
        </div>
        <div class="clocks">
            <div id="relojNegras" class="clock clock-inactive">05:00</div>
            <div id="relojBlancas" class="clock clock-inactive">05:00</div>
        </div>
    </div>
    
    <div style="text-align: center; margin-bottom: 5px;">
        <span id="estadoJuego" style="color:#ffd700; font-weight:bold;">¡Haz tu primer movimiento para iniciar el reloj!</span>
    </div>

    <div class="board-wrapper">
        <button class="btn-config" onclick="toggleConfig()">⚙️</button>
        
        <div id="configModal">
            <h3 style="margin-top:0; color:#ffd700; border-bottom:1px solid #3a506b; padding-bottom:5px;">Ajustes</h3>
            <div class="config-item">
                <label>Piezas:</label>
                <select id="selPiezas" onchange="actualizarAjustes()">
                    <option value="custom">Chema/Goyo</option>
                    <option value="classic">Clásicas</option>
                </select>
            </div>
            <div class="config-item">
                <label>Tablero:</label>
                <select id="selTablero" onchange="actualizarAjustes()">
                    <option value="board-classic">Madera</option>
                    <option value="board-juven">Oscuro</option>
                </select>
            </div>
            <div class="config-item">
                <label>Ayuda:</label>
                <input type="checkbox" id="chkAyuda" checked onchange="actualizarAjustes()">
            </div>
            <button onclick="toggleConfig()" style="width:100%; background:#06d6a0; border:none; padding:5px; border-radius:4px; margin-top:10px; font-weight:bold;">Cerrar</button>
        </div>

        <div id="board" class="board-classic"></div>
    </div>

    <div class="history-panel">
        <h3>Historial de Partida</h3>
        <div class="history-list" id="moveHistory"></div>
    </div>

    <button class="btn-volver" onclick="window.location.href='menu.html';">Volver al Menú</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const username = localStorage.getItem('username') || 'INVITADO';
        document.getElementById('nombreJugador').innerText = username;

        // Asignación de avatares según el usuario
        if(username.toLowerCase() === 'cifra' || username.toLowerCase() === 'admin') {
            document.getElementById('avatarImg').src = 'profe.png';
        } else if (username.toLowerCase() === 'santa') {
            document.getElementById('avatarImg').src = 'santa.png';
        } else {
            document.getElementById('avatarImg').src = 'zapata.png';
        }

        var board = null;
        var game = new Chess();
        var $board = $('#board');
        
        // Variables de Reloj
        let tiempoBlancas = 300; // 5 minutos en segundos
        let tiempoNegras = 300;
        let timerInterval = null;
        let juegoIniciado = false;

        var configPiezas = 'custom';
        var mostrarAyuda = true;

        function toggleConfig() {
            const modal = document.getElementById('configModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function actualizarAjustes() {
            configPiezas = document.getElementById('selPiezas').value;
            mostrarAyuda = document.getElementById('chkAyuda').checked;
            $board.removeClass('board-classic board-juven');
            $board.addClass(document.getElementById('selTablero').value);
            board.position(game.fen());
        }

        function pieceTheme(piece) {
            if (configPiezas === 'classic') {
                // Nuevo servidor 100% estable para las piezas clásicas
                return 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/' + piece + '.png';
            }
            const customPieces = {
                'wP': 'chemapeon.png', 'wN': 'chemacaballo.png', 'wB': 'chemaalfil.png', 'wR': 'chematorre.png', 'wQ': 'chemareyna.png', 'wK': 'chemarey.png',
                'bP': 'goyopeon.png', 'bN': 'goyocaballo.png', 'bB': 'goyoalfil.png', 'bR': 'goyotorre.png', 'bQ': 'goyoreina.png', 'bK': 'goyorey.png'
            };
            return customPieces[piece];
        }

        function removeHighlights() {
            $board.find('.square-55d63').removeClass('highlight1-32417 highlight2-9c5d2');
        }

        function greySquare(square) {
            $board.find('.square-' + square).addClass('highlight1-32417');
        }

        // CONTROL DE RELOJES
        function formatoTiempo(segundos) {
            let min = Math.floor(segundos / 60);
            let seg = segundos % 60;
            return (min < 10 ? "0" + min : min) + ":" + (seg < 10 ? "0" + seg : seg);
        }

        function actualizarRelojesUI() {
            document.getElementById('relojBlancas').innerText = formatoTiempo(tiempoBlancas);
            document.getElementById('relojNegras').innerText = formatoTiempo(tiempoNegras);
            
            if (game.turn() === 'w') {
                document.getElementById('relojBlancas').className = 'clock clock-active';
                document.getElementById('relojNegras').className = 'clock clock-inactive';
            } else {
                document.getElementById('relojBlancas').className = 'clock clock-inactive';
                document.getElementById('relojNegras').className = 'clock clock-active';
            }
        }

        function iniciarReloj() {
            if(!juegoIniciado) {
                juegoIniciado = true;
                timerInterval = setInterval(() => {
                    if(game.game_over()) { clearInterval(timerInterval); return; }
                    
                    if(game.turn() === 'w') {
                        tiempoBlancas--;
                        if(tiempoBlancas <= 0) finPorTiempo("Negras");
                    } else {
                        tiempoNegras--;
                        if(tiempoNegras <= 0) finPorTiempo("Blancas");
                    }
                    actualizarRelojesUI();
                }, 1000);
            }
            actualizarRelojesUI();
        }

        function finPorTiempo(ganador) {
            clearInterval(timerInterval);
            document.getElementById('estadoJuego').innerText = `¡Se acabó el tiempo! ${ganador} ganan.`;
            if(ganador === "Blancas") lanzarConfeti();
            // Evitar más movimientos
            board.draggable = false; 
        }

        // HISTORIAL DE MOVIMIENTOS
        function actualizarHistorial() {
            const historial = game.history();
            const panel = document.getElementById('moveHistory');
            let html = '';
            
            for(let i = 0; i < historial.length; i += 2) {
                let turno = (i / 2) + 1;
                let blanca = historial[i];
                let negra = historial[i+1] ? historial[i+1] : '';
                html += `<div><b>${turno}.</b></div> <div>${blanca}</div> <div>${negra}</div>`;
            }
            panel.innerHTML = html;
            // Auto scroll hacia el final
            panel.parentElement.scrollTop = panel.parentElement.scrollHeight;
        }

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over() || tiempoBlancas <= 0 || tiempoNegras <= 0) return false;
            if (piece.search(/^b/) !== -1) return false; // IA juega negras
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            removeHighlights();
            iniciarReloj();
            actualizarHistorial();
            actualizarEstado();
            window.setTimeout(hacerMovimientoIA, 250);
        }

        function onMouseoverSquare(square, piece) {
            if (!mostrarAyuda || game.game_over()) return;
            var moves = game.moves({ square: square, verbose: true });
            if (moves.length === 0) return;

            greySquare(square);
            for (var i = 0; i < moves.length; i++) {
                greySquare(moves[i].to);
            }
        }

        function onMouseoutSquare(square, piece) {
            removeHighlights();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function hacerMovimientoIA() {
            var posiblesMovimientos = game.moves();
            if (posiblesMovimientos.length === 0) return;

            var move = game.move(posiblesMovimientos[Math.floor(Math.random() * posiblesMovimientos.length)]);
            board.position(game.fen());
            
            if(mostrarAyuda) {
                removeHighlights();
                $board.find('.square-' + move.from).addClass('highlight2-9c5d2');
                $board.find('.square-' + move.to).addClass('highlight2-9c5d2');
            }
            
            actualizarRelojesUI();
            actualizarHistorial();
            actualizarEstado();
        }

        function actualizarEstado() {
            if (tiempoBlancas <= 0 || tiempoNegras <= 0) return; // Si ganó por tiempo, no sobreescribir

            var status = '';
            var moverColor = game.turn() === 'b' ? 'Turno de Negras (IA)' : 'Turno de Blancas (Tú)';

            if (game.in_checkmate()) {
                status = 'Jaque mate. Ganan las ' + (game.turn() === 'b' ? 'Blancas' : 'Negras');
                clearInterval(timerInterval);
                if(game.turn() === 'b') lanzarConfeti();
            } else if (game.in_draw()) {
                status = 'Juego terminado en empate.';
                clearInterval(timerInterval);
            } else {
                status = moverColor;
                if (game.in_check()) status += ' (¡Jaque!)';
            }
            document.getElementById('estadoJuego').innerText = status;
        }

        function lanzarConfeti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#06d6a0'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#06d6a0'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        var config = {
            draggable: true,
            position: 'start',
            showNotation: true,
            pieceTheme: pieceTheme,
            onDragStart: onDragStart,
            onDrop: onDrop,
            onMouseoutSquare: onMouseoutSquare,
            onMouseoverSquare: onMouseoverSquare,
            onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('board', config);
        actualizarRelojesUI(); // Configura los relojes visualmente al cargar
    </script>
</body>
</html>
