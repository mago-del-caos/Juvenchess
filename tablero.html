<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Tablero</title>
    <!-- Estilos de Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohOuzBxs4qCTv5eG+xy326WprgtB3b8Zl50OteB3tF4pkhjC65F" crossorigin="anonymous">
    <style>
        body {
            background-color: #0b132b; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
        }
        .info-panel {
            background-color: #1c2541;
            border: 2px solid #3a506b;
            border-radius: 8px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .info-text {
            color: #06d6a0;
            font-weight: bold;
        }
        #board {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            border: 4px solid #ffd700;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .btn-volver {
            background-color: #d62828;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-volver:hover {
            background-color: #a81d1d;
        }
    </style>
</head>
<body>

    <h1>JUVENCHESS</h1>
    
    <div class="info-panel">
        <span class="info-text">Jugador: <span id="nombreJugador" style="color:white;">Invitado</span></span>
        <span class="info-text">Estado: <span id="estadoJuego" style="color:white;">Jugando</span></span>
    </div>

    <!-- Contenedor del tablero -->
    <div id="board"></div>

    <button class="btn-volver" onclick="window.location.href='menu.html';">Volver al Menú</button>

    <!-- Librerías de jQuery, Chessboard.js y Chess.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>

    <script>
        // Cargar nombre del jugador
        const username = localStorage.getItem('username') || 'INVITADO';
        document.getElementById('nombreJugador').innerText = username;

        // Variables del juego
        var board = null;
        var game = new Chess();
        var $estado = $('#estadoJuego');

        // Función cuando el jugador levanta una pieza
        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            // Solo permitir mover piezas blancas (jugador)
            if (piece.search(/^b/) !== -1) return false;
        }

        // Función cuando el jugador suelta una pieza
        function onDrop (source, target) {
            // Ver si el movimiento es legal
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Siempre promueve a reina por simplicidad
            });

            // Si es ilegal, la pieza regresa a su lugar
            if (move === null) return 'snapback';

            actualizarEstado();

            // Turno de la IA (un movimiento aleatorio simple por ahora)
            window.setTimeout(hacerMovimientoIA, 250);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        // Movimiento básico del Bot (IA)
        function hacerMovimientoIA () {
            var posiblesMovimientos = game.moves();
            if (posiblesMovimientos.length === 0) return; // Fin del juego

            var indiceAleatorio = Math.floor(Math.random() * posiblesMovimientos.length);
            game.move(posiblesMovimientos[indiceAleatorio]);
            board.position(game.fen());
            actualizarEstado();
        }

        function actualizarEstado () {
            var status = '';
            var moverColor = game.turn() === 'b' ? 'Negras' : 'Blancas';

            if (game.in_checkmate()) {
                status = 'Juego terminado, ' + moverColor + ' en jaque mate.';
            } else if (game.in_draw()) {
                status = 'Juego terminado, empate.';
            } else {
                status = 'Turno de ' + moverColor;
                if (game.in_check()) {
                    status += ', ' + moverColor + ' están en jaque';
                }
            }
            $estado.html(status);
        }

        // Configuración visual del tablero
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('board', config);
        actualizarEstado();
    </script>
</body>
</html>
