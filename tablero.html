<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JUVENCHESS | Arena Multijugador</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root { --bg-app: #06152D; --bg-panel: #0F294D; --gold: #FACC15; --green: #10B981; --sq-light: #FEF3C7; --sq-dark: #1E3A8A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-app); color: #FFF; display: flex; justify-content: center; min-height: 100vh; padding: 10px; }
    .arena-layout { display: flex; gap: 20px; width: 100%; max-width: 1000px; align-items: flex-start; }
    .board-section { flex: 1; display: flex; flex-direction: column; gap: 10px; max-width: 600px; }
    .player-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .player-info { display: flex; align-items: center; gap: 12px; }
    .player-avatar { width: 45px; height: 45px; border-radius: 6px; background: #000; border: 2px solid rgba(255,255,255,0.1); object-fit: cover;}
    .player-name { font-weight: 800; } .player-elo { font-size: 0.75rem; color: #94A3B8; display: block; }
    .clock { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; background: #000; padding: 5px 12px; border-radius: 6px; font-weight: 700; }
    .clock.active { background: #FFF; color: #000; }
    
    .board-frame { width: 100%; aspect-ratio: 1 / 1; border: 4px solid var(--bg-panel); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    .board-grid { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
    .square { position: relative; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .sq-light { background-color: var(--sq-light); color: var(--sq-dark); }
    .sq-dark { background-color: var(--sq-dark); color: var(--sq-light); }
    .sq-selected::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.4); z-index: 2; }
    .sq-last-move::after { content: ''; position: absolute; inset: 0; background: rgba(250,204,21,0.4); z-index: 1; }
    
    .piece-classic { font-size: 3rem; z-index: 5; pointer-events: none; line-height: 1; }
    .piece-white { color: #FFFFFF; text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
    .piece-black { color: #000000; text-shadow: 0px 2px 4px rgba(255, 255, 255, 0.4), -1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF, 1px 1px 0 #FFF; }
    
    .sidebar-section { width: 300px; background: var(--bg-panel); border-radius: 8px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); min-height: 400px; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--gold); }
    .history-list { flex: 1; overflow-y: auto; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
    .history-row { display: flex; padding: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .hist-num { width: 30px; color: #94A3B8; }
    .hist-move { flex: 1; text-align: center; }
    .btn-leave { background: none; border: none; color: #94A3B8; cursor: pointer; font-weight: bold; }
    .btn-leave:hover { color: #FFF; }
    
    .waiting-screen { position: absolute; inset: 0; background: rgba(6, 21, 45, 0.9); z-index: 50; display: flex; justify-content: center; align-items: center; color: var(--gold); font-weight: bold; font-size: 1.2rem; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="arena-layout">
    <div class="board-section">
      <div class="player-bar">
        <div class="player-info">
          <div class="player-avatar"></div>
          <div><span class="player-name" id="top-name">Esperando...</span><span class="player-elo" id="top-elo">--</span></div>
        </div>
        <div class="clock" id="top-clock">--:--</div>
      </div>

      <div class="board-frame">
        <div class="waiting-screen hidden" id="waiting-screen">Buscando oponente en línea...</div>
        <div class="board-grid" id="chessboard"></div>
      </div>

      <div class="player-bar">
        <div class="player-info">
          <div class="player-avatar"></div>
          <div><span class="player-name" id="bottom-name">Local</span><span class="player-elo" id="bottom-elo">Preparando</span></div>
        </div>
        <div class="clock active" id="bottom-clock">--:--</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-header"><span id="match-info">INICIANDO</span> <button class="btn-leave" onclick="window.location.href='index.html'">✕ Salir</button></div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    let config = JSON.parse(localStorage.getItem('juvenchess_config')) || { mode: 'online', room: 'sala_test' };
    const sesion = JSON.parse(sessionStorage.getItem('juvenchess_session'));
    const miNombre = sesion ? sesion.username : 'Invitado_' + Math.floor(Math.random()*100);
    const miElo = sesion ? sesion.puntuacion : 0;

    const PIECES_CLASSIC = { w: { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕', k: '♔' }, b: { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' } };

    const game = new Chess();
    let flipped = false; let selectedSq = null; let myColor = 'w';
    let lastMoveSeen = null;
    let isGameOver = false;

    document.getElementById('bottom-name').textContent = miNombre;

    // MOTOR DE PULSOS ONLINE
    if (config.mode === 'online') {
      document.getElementById('waiting-screen').classList.remove('hidden');
      
      setInterval(async () => {
        if (isGameOver) return;
        try {
          const res = await fetch('https://juvenchess-api.adrian-camelot32.workers.dev/api/sala/estado', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ room: config.room, username: miNombre, elo: miElo })
          });
          const sala = await res.json();
          
          if (sala.status === 'playing') {
            document.getElementById('waiting-screen').classList.add('hidden');
            
            const soyJ1 = sala.j1.username === miNombre;
            myColor = soyJ1 ? sala.j1.color : sala.j2.color;
            flipped = (myColor === 'b');
            const rival = soyJ1 ? sala.j2 : sala.j1;
            
            document.getElementById('top-name').textContent = rival.username;
            document.getElementById('top-elo').textContent = `Elo: ${rival.elo}`;
            document.getElementById('bottom-elo').textContent = myColor === 'w' ? 'Piezas Blancas' : 'Piezas Negras';
            document.getElementById('match-info').textContent = "EN LÍNEA";
            
            if (sala.lastMove && JSON.stringify(sala.lastMove.move) !== JSON.stringify(lastMoveSeen)) {
              if (sala.lastMove.byColor !== myColor) {
                game.move(sala.lastMove.move);
                lastMoveSeen = sala.lastMove.move;
                updateAll();
                checkGameStatus();
              }
            }
          }
        } catch (e) {}
      }, 1000); 
    }

    // RENDERIZAR TABLERO
    function renderBoard() {
      const boardEl = document.getElementById('chessboard'); boardEl.innerHTML = '';
      const files = 'abcdefgh';
      const history = game.history({ verbose: true });
      const lastMove = history.length > 0 ? history[history.length - 1] : null;

      for (let i = 0; i < 64; i++) {
        const vR = Math.floor(i / 8); const vC = i % 8;
        const r = flipped ? 7 - vR : vR; const c = flipped ? 7 - vC : vC;
        const sq = files[c] + (8 - r);
        const piece = game.get(sq);
        
        const cell = document.createElement('div');
        cell.className = `square ${(r + c) % 2 === 0 ? 'sq-light' : 'sq-dark'}`;
        if (selectedSq === sq) cell.classList.add('sq-selected');
        if (lastMove && (lastMove.from === sq || lastMove.to === sq)) cell.classList.add('sq-last-move');
        
        if (piece) {
          const span = document.createElement('span'); 
          span.className = `piece-classic ${piece.color === 'w' ? 'piece-white' : 'piece-black'}`;
          span.textContent = PIECES_CLASSIC[piece.color][piece.type]; 
          cell.appendChild(span);
        }
        cell.onclick = () => onSquareClick(sq);
        boardEl.appendChild(cell);
      }
    }

    // MOVIMIENTO DE PIEZA
    function onSquareClick(sq) {
      if (isGameOver) return;
      if (config.mode === 'online' && game.turn() !== myColor) return; 

      const moves = game.moves({ square: selectedSq, verbose: true });
      const move = moves.find(m => m.to === sq);

      if (move) {
        const moveObj = { from: selectedSq, to: sq, promotion: 'q' };
        game.move(moveObj);
        selectedSq = null;
        lastMoveSeen = moveObj;
        
        if (config.mode === 'online') {
          fetch('https://juvenchess-api.adrian-camelot32.workers.dev/api/sala/mover', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ room: config.room, move: moveObj, byColor: myColor })
          });
        }
        updateAll();
        checkGameStatus();
      } else {
        const piece = game.get(sq);
        selectedSq = (piece && piece.color === game.turn()) ? sq : null;
        renderBoard();
      }
    }

    // ACTUALIZAR INTERFAZ
    function updateAll() {
      renderBoard();
      const hist = game.history(); let html = '';
      for (let i = 0; i < hist.length; i+=2) html += `<div class="history-row"><div class="hist-num">${(i/2)+1}.</div><div class="hist-move">${hist[i]}</div><div class="hist-move">${hist[i+1] || ''}</div></div>`;
      const listEl = document.getElementById('history-list'); listEl.innerHTML = html; listEl.scrollTop = listEl.scrollHeight;
      
      document.getElementById('top-clock').classList.toggle('active', game.turn() === (flipped ? 'w' : 'b'));
      document.getElementById('bottom-clock').classList.toggle('active', game.turn() === (flipped ? 'b' : 'w'));
    }

    // ARBITRO AUTOMÁTICO Y RESULTADOS
    function checkGameStatus() {
      if (game.in_checkmate()) { 
        endGame(game.turn() === 'w' ? 'b' : 'w', "Jaque Mate Oficial"); 
        if(game.turn() === 'b' && myColor === 'w' || game.turn() === 'w' && myColor === 'b') {
          confetti({ particleCount: 150, spread: 80 }); 
        }
      }
      else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition() || game.insufficient_material()) { 
        endGame('draw', "Tablas (Empate Oficial)"); 
      }
    }

    function endGame(winner, reason) {
      isGameOver = true;
      document.getElementById('match-info').textContent = "PARTIDA FINALIZADA";
      
      let alertMsg = "";
      if (winner === 'draw') {
        alertMsg = "¡EMPATE! " + reason + "\nNadie suma ni pierde puntos. La sala se cerrará.";
      } else if (winner === myColor) {
        alertMsg = "¡VICTORIA! " + reason + "\n¡Has ganado 10 puntos de Elo!";
      } else {
        alertMsg = "DERROTA. " + reason + "\nNo ganaste puntos esta vez.";
      }
      
      setTimeout(() => {
        alert(alertMsg + "\n\nPresiona Aceptar para volver al menú.");
        
        if (config.mode === 'online' && myColor === 'w') {
           fetch('https://juvenchess-api.adrian-camelot32.workers.dev/api/sala/terminar', {
             method: 'POST', headers: {'Content-Type': 'application/json'},
             body: JSON.stringify({ 
               room: config.room, 
               ganador: winner, // Mandamos 'draw' para que el servidor borre la sala sin dar puntos
               pgn: game.pgn(),
               blancasUsuario: miNombre,
               negrasUsuario: document.getElementById('top-name').textContent
             })
           }).then(() => window.location.href = 'index.html');
        } else {
           window.location.href = 'index.html';
        }
      }, 500);
    }

    renderBoard();
  </script>
</body>
</html>
