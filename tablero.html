<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Tablero</title>
    <!-- CSS estable para que se dibujen los cuadros del tablero -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            background-color: #0b132b; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
        }
        .info-panel {
            background-color: #1c2541;
            border: 2px solid #3a506b;
            border-radius: 8px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .info-text {
            color: #06d6a0;
            font-weight: bold;
        }
        #board {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            border: 4px solid #ffd700;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            /* Asegura que el fondo oscuro no oculte los cuadros negros */
            background-color: #ffffff; 
        }
        .btn-volver {
            background-color: #d62828;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-volver:hover {
            background-color: #a81d1d;
        }
    </style>
</head>
<body>

    <h1>JUVENCHESS</h1>
    
    <div class="info-panel">
        <span class="info-text">Jugador: <span id="nombreJugador" style="color:white;">Invitado</span></span>
        <span class="info-text">Estado: <span id="estadoJuego" style="color:white;">Jugando</span></span>
    </div>

    <!-- Contenedor del tablero -->
    <div id="board"></div>

    <button class="btn-volver" onclick="window.location.href='menu.html';">Volver al Menú</button>

    <!-- Librerías desde CDNs más confiables -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        const username = localStorage.getItem('username') || 'INVITADO';
        document.getElementById('nombreJugador').innerText = username;

        var board = null;
        var game = new Chess();
        var $estado = $('#estadoJuego');

        // Mapeo exacto de tus piezas personalizadas
        function usarPiezasPersonalizadas(piece) {
            // "w" son las blancas (Chema), "b" son las negras (Goyo).
            // Si necesitas invertirlos, solo cambia los nombres de los archivos aquí.
            const piezas = {
                'wP': 'chemapeon.png',
                'wN': 'chemacaballo.png',
                'wB': 'chemaalfil.png',
                'wR': 'chematorre.png',
                'wQ': 'chemareyna.png',
                'wK': 'chemarey.png',
                
                'bP': 'goyopeon.png',
                'bN': 'goyocaballo.png',
                'bB': 'goyoalfil.png',
                'bR': 'goyotorre.png',
                'bQ': 'goyoreina.png',
                'bK': 'goyorey.png'
            };
            return piezas[piece];
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false; // Solo permite mover blancas
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';
            actualizarEstado();
            window.setTimeout(hacerMovimientoIA, 250);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function hacerMovimientoIA () {
            var posiblesMovimientos = game.moves();
            if (posiblesMovimientos.length === 0) return;

            var indiceAleatorio = Math.floor(Math.random() * posiblesMovimientos.length);
            game.move(posiblesMovimientos[indiceAleatorio]);
            board.position(game.fen());
            actualizarEstado();
        }

        function actualizarEstado () {
            var status = '';
            var moverColor = game.turn() === 'b' ? 'Negras (Goyo)' : 'Blancas (Chema)';

            if (game.in_checkmate()) {
                status = 'Jaque mate. ' + moverColor + ' pierden.';
            } else if (game.in_draw()) {
                status = 'Juego terminado en empate.';
            } else {
                status = 'Turno de ' + moverColor;
                if (game.in_check()) status += ' (¡Jaque!)';
            }
            $estado.html(status);
        }

        // Configuración con tu tema de piezas integrado
        var config = {
            draggable: true,
            position: 'start',
            pieceTheme: usarPiezasPersonalizadas, // Llama a la función de tus imágenes
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('board', config);
        actualizarEstado();
    </script>
</body>
</html>
