<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVENCHESS | Tablero Ultra Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        h1 { color: #ffd700; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 1.7rem; }

        .info-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 460px; box-sizing: border-box; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #06d6a0; object-fit: cover; margin-right: 10px; background-color: #0b132b; }
        .player-info { display: flex; align-items: center; font-weight: bold; }

        .clocks { display: flex; flex-direction: column; align-items: flex-end; font-family: monospace; font-size: 1.1rem; gap: 4px; }
        .clock { padding: 3px 10px; border-radius: 6px; font-weight: bold; transition: 0.3s; text-align: right; }
        .clock-active { background-color: #06d6a0; color: #0b132b; box-shadow: 0 0 10px rgba(6, 214, 160, 0.6); font-size: 1.25rem; }
        .clock-inactive { background-color: #0b132b; color: #9aa5ce; border: 1px solid #3a506b; }

        .status-bar { width: 100%; max-width: 460px; background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        #estadoJuego { color: #ffd700; font-weight: bold; font-size: 0.95rem; }
        #ultimaJugadaBot { color: #06d6a0; font-family: monospace; font-size: 0.9rem; font-weight: bold; }

        .captured-bar { width: 100%; max-width: 460px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .captured-side { flex: 1; background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 4px 8px; min-height: 32px; display: flex; align-items: center; flex-wrap: wrap; gap: 1px; box-sizing: border-box; }
        .captured-side img { width: 22px; height: 22px; }
        .captured-diff { color: #ffd700; font-weight: bold; font-size: 0.85rem; margin-left: 4px; }
        .captured-label { color: #9aa5ce; font-size: 0.72rem; width: 100%; }

        .board-wrapper { position: relative; width: 100%; max-width: 460px; margin-bottom: 10px; }
        #board { position: relative; width: 100%; aspect-ratio: 1 / 1; border: 4px solid #ffd700; border-radius: 6px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); box-sizing: border-box; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
        #board .sq { position: absolute; width: 12.5%; height: 12.5%; }
        #board.board-classic .sq.light { background-color: #f0d9b5; }
        #board.board-classic .sq.dark { background-color: #b58863; }
        #board.board-juven .sq.light { background-color: #e0e0e0; }
        #board.board-juven .sq.dark { background-color: #1c2541; }
        #board .coord { position: absolute; font-size: 10px; font-weight: 700; pointer-events: none; }
        #board .coord.rank { top: 2px; left: 3px; }
        #board .coord.file { bottom: 1px; right: 3px; }
        #board.board-classic .sq.light .coord { color: #b58863; }
        #board.board-classic .sq.dark .coord { color: #f0d9b5; }
        #board.board-juven .sq.light .coord { color: #1c2541; }
        #board.board-juven .sq.dark .coord { color: #e0e0e0; }

        .hl { position: absolute; width: 12.5%; height: 12.5%; pointer-events: none; z-index: 2; }
        .hl-last { background-color: rgba(255, 215, 0, 0.38); }
        .hl-sel { background-color: rgba(6, 214, 160, 0.38); box-shadow: inset 0 0 0 3px rgba(6, 214, 160, 0.9); }
        .hl-check { background: radial-gradient(circle, rgba(214,40,40,0.85) 0%, rgba(214,40,40,0) 70%); }
        .hl-dot { background: radial-gradient(circle, rgba(10, 20, 10, 0.22) 0 27%, transparent 28%); }
        .hl-cap { background: radial-gradient(circle, transparent 0 79%, rgba(10, 20, 10, 0.22) 80% 100%); }

        .piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: contain; background-position: center; background-repeat: no-repeat; transition: transform 0.18s ease-in-out, opacity 0.15s ease; z-index: 3; cursor: grab; }
        .piece.drag { transition: none; z-index: 10; cursor: grabbing; filter: drop-shadow(0 12px 10px rgba(0,0,0,0.45)); }

        #promo { position: absolute; z-index: 30; display: flex; flex-direction: column; width: 12.5%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; }
        #promo.hidden { display: none; }
        .promo-opt { width: 100%; aspect-ratio: 1 / 1; background-color: rgba(27, 32, 48, 0.95); background-size: contain; background-position: center; background-repeat: no-repeat; cursor: pointer; }
        .promo-opt:hover { background-color: rgba(6, 214, 160, 0.85); }
        #promoBackdrop { position: absolute; inset: 0; z-index: 25; }
        #promoBackdrop.hidden { display: none; }

        .btn-config { position: absolute; top: -12px; right: -12px; background: #06d6a0; color: #0b132b; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: 0.3s; }
        .btn-config:hover { background: #05b383; transform: scale(1.1); }

        #configModal { display: none; position: absolute; top: 35px; right: 0; background: #1c2541; border: 2px solid #3a506b; border-radius: 8px; padding: 15px; z-index: 101; box-shadow: 0 8px 16px rgba(0,0,0,0.85); min-width: 250px; }
        .config-item { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .config-item select { padding: 5px; border-radius: 4px; background: #0b132b; color: white; border: 1px solid #3a506b; width: 58%; font-size: 0.9rem; }

        .btn-accion { background: #06d6a0; border: none; padding: 8px; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; color:#0b132b; }
        .btn-accion:hover { background: #05b383; }
        .btn-danger { background: #d62828; color: white; }
        .btn-danger:hover { background: #a81d1d; }

        .history-panel { background-color: #1c2541; border: 2px solid #3a506b; border-radius: 8px; width: 100%; max-width: 460px; height: 95px; overflow-y: auto; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        .history-panel h3 { margin: 0 0 5px 0; color: #06d6a0; font-size: 0.95rem; border-bottom: 1px solid #3a506b; padding-bottom: 3px; display: flex; justify-content: space-between; }
        .history-list { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 4px; font-size: 0.88rem; color: #e0e0e0; font-family: monospace; }

        .controls-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; max-width: 460px; }
        .btn-ctrl { padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .btn-deshacer { background: #ff9f1c; color: #0b132b; }
        .btn-reiniciar { background: #3a506b; color: #ffffff; }
        .btn-volver { background: #d62828; color: #ffffff; }
    </style>
</head>
<body>

    <h1><i class="fas fa-chess"></i> JUVENCHESS</h1>

    <div class="info-panel">
        <div class="player-info">
            <img src="zapata.png" alt="Avatar" class="avatar" id="avatarImg" onerror="this.src='zapata.png'">
            <div style="line-height: 1.25;">
                <span style="color:#06d6a0; font-size:0.8rem;"><i class="fas fa-user"></i> Jugador:</span><br>
                <span id="nombreJugador" style="color:white; font-size:1.05rem;">Invitado</span>
            </div>
        </div>
        <div class="clocks">
            <div id="relojNegras" class="clock clock-inactive"><i class="fas fa-robot"></i> <span id="nombreBot" style="font-size:0.8rem;">Bot</span>: 05:00</div>
            <div id="relojBlancas" class="clock clock-inactive"><i class="fas fa-stopwatch"></i> Tú: 05:00</div>
        </div>
    </div>

    <div class="status-bar">
        <span id="estadoJuego">¡Haz tu primer movimiento para iniciar!</span>
        <span id="ultimaJugadaBot"></span>
    </div>

    <div class="captured-bar">
        <div class="captured-side"><span class="captured-label">Tú capturaste</span><span id="capPorMi"></span><span class="captured-diff" id="difMia"></span></div>
        <div class="captured-side"><span class="captured-label">El bot capturó</span><span id="capPorBot"></span><span class="captured-diff" id="difBot"></span></div>
    </div>

    <div class="board-wrapper">
        <button class="btn-config" onclick="toggleConfig()" title="Ajustes"><i class="fas fa-cog"></i></button>

        <div id="configModal">
            <h3 style="margin-top:0; color:#ffd700; border-bottom:1px solid #3a506b; padding-bottom:5px;"><i class="fas fa-sliders-h"></i> Ajustes</h3>

            <div class="config-item">
                <label><i class="fas fa-clock"></i> Reloj:</label>
                <select id="selTiempo" onchange="cambiarTiempo()">
                    <option value="60">Bala (1 min)</option>
                    <option value="180">Blitz (3 min)</option>
                    <option value="300" selected>Blitz (5 min)</option>
                    <option value="600">Rápido (10 min)</option>
                    <option value="1800">Clásico (30 min)</option>
                </select>
            </div>

            <div class="config-item">
                <label><i class="fas fa-chess-knight"></i> Piezas:</label>
                <select id="selPiezas" onchange="actualizarAjustes()">
                    <option value="classic" selected>Normales</option>
                    <option value="custom">Chema/Goyo</option>
                </select>
            </div>

            <div class="config-item">
                <label><i class="fas fa-chess-board"></i> Tablero:</label>
                <select id="selTablero" onchange="actualizarAjustes()">
                    <option value="board-classic">Madera</option>
                    <option value="board-juven">Oscuro</option>
                </select>
            </div>

            <div class="config-item">
                <label><i class="fas fa-volume-up"></i> Sonido:</label>
                <select id="selSonido">
                    <option value="on">Activado</option>
                    <option value="off">Silencio</option>
                </select>
            </div>

            <div class="config-item">
                <label><i class="fas fa-lightbulb"></i> Guía visual:</label>
                <input type="checkbox" id="chkAyuda" checked onchange="actualizarAjustes()">
            </div>

            <button class="btn-accion" onclick="toggleConfig()"><i class="fas fa-check"></i> Listo</button>
        </div>

        <div id="board" class="board-classic">
            <div id="sqLayer"></div>
            <div id="hlLayer"></div>
            <div id="pcLayer"></div>
            <div id="promoBackdrop" class="hidden"></div>
            <div id="promo" class="hidden"></div>
        </div>
    </div>

    <div class="history-panel">
        <h3>
            <span><i class="fas fa-list-ol"></i> Historial de Jugadas</span>
            <span id="nivelBotBadge" style="color:#ffd700; font-size:0.8rem;"></span>
        </h3>
        <div class="history-list" id="moveHistory"></div>
    </div>

    <div class="controls-bar">
        <button class="btn-ctrl btn-deshacer" onclick="deshacerJugada()"><i class="fas fa-undo"></i> Deshacer</button>
        <button class="btn-ctrl btn-reiniciar" onclick="reiniciarPartida()"><i class="fas fa-redo"></i> Reiniciar</button>
        <button class="btn-ctrl btn-volver" onclick="window.location.href='menu.html';"><i class="fas fa-arrow-left"></i> Menú</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

    <script>
        const username = localStorage.getItem('username') || 'INVITADO';
        const botName = localStorage.getItem('botName') || 'Francisco I. Madero (Principiante)';
        const savedAvatar = localStorage.getItem('avatar');

        document.getElementById('nombreJugador').innerText = username;
        const nombreCortoBot = botName.split('(')[0].trim();
        document.getElementById('nombreBot').innerText = nombreCortoBot;
        document.getElementById('nivelBotBadge').innerText = botName;

        if (savedAvatar && savedAvatar !== 'null' && savedAvatar !== 'undefined') {
            document.getElementById('avatarImg').src = savedAvatar;
        } else if (username.toLowerCase().includes('cifra') || username.toLowerCase() === 'admin') {
            document.getElementById('avatarImg').src = 'profe.png';
        } else {
            document.getElementById('avatarImg').src = 'zapata.png';
        }

        // --- DETERMINAR NIVEL DE INTELIGENCIA DEL BOT HISTÓRICO ---
        function obtenerNivelBot(nombre) {
            if (nombre.includes('Principiante')) return 1;
            if (nombre.includes('Básico')) return 2;
            if (nombre.includes('Intermedio')) return 3;
            if (nombre.includes('Avanzado')) return 4;
            return 5;
        }
        const nivelIA = obtenerNivelBot(botName);

        var game = new Chess();
        const boardEl = document.getElementById('board');
        const sqLayer = document.getElementById('sqLayer');
        const hlLayer = document.getElementById('hlLayer');
        const pcLayer = document.getElementById('pcLayer');
        const promoEl = document.getElementById('promo');
        const promoBackdrop = document.getElementById('promoBackdrop');
        const FILES = 'abcdefgh';

        let tiempoInicial = 300;
        let tiempoBlancas = 300;
        let tiempoNegras = 300;
        let timerInterval = null;
        let juegoIniciado = false;
        let ultimoOrigen = null;
        let ultimoDestino = null;
        var configPiezas = 'classic';
        var mostrarAyuda = true;

        // --- ESTADO DE INTERACCIÓN (estilo chess.com) ---
        let pieceEls = {};        // casilla -> elemento DOM de la pieza
        let seleccion = null;     // casilla seleccionada
        let destinosSel = [];     // movimientos legales desde la selección
        let arrastrando = null;   // {from, el, startX, startY, activo, eraSeleccion}
        let animando = false;
        let promoPendiente = null;

        // --- SISTEMA DE SONIDO SINTETIZADO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(tipo) {
            if (document.getElementById('selSonido') && document.getElementById('selSonido').value === 'off') return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (tipo === 'mover') {
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (tipo === 'captura') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(210, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
                    osc.start(now); osc.stop(now + 0.11);
                } else if (tipo === 'bot') {
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                } else if (tipo === 'jaque') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(310, now);
                    osc.frequency.setValueAtTime(220, now + 0.14);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        function toggleConfig() {
            const modal = document.getElementById('configModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function cambiarTiempo() {
            if (juegoIniciado) {
                Swal.fire({ title: '¡Partida en curso!', text: 'Reinicia la partida para cambiar el reloj.', icon: 'warning', background: '#1c2541', color: '#fff', confirmButtonColor: '#06d6a0' });
                document.getElementById('selTiempo').value = tiempoInicial;
                return;
            }
            tiempoInicial = parseInt(document.getElementById('selTiempo').value) || 300;
            tiempoBlancas = tiempoInicial;
            tiempoNegras = tiempoInicial;
            actualizarRelojesUI();
        }

        function actualizarAjustes() {
            configPiezas = document.getElementById('selPiezas').value;
            mostrarAyuda = document.getElementById('chkAyuda').checked;
            boardEl.classList.remove('board-classic', 'board-juven');
            boardEl.classList.add(document.getElementById('selTablero').value);
            renderAll();
            pintarResaltados();
        }

        function pieceTheme(piece) {
            if (configPiezas === 'classic') return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
            const customPieces = {
                'wP': 'chemapeon.png', 'wN': 'chemacaballo.png', 'wB': 'chemaalfil.png', 'wR': 'chematorre.png', 'wQ': 'chemareyna.png', 'wK': 'chemarey.png',
                'bP': 'goyopeon.png', 'bN': 'goyocaballo.png', 'bB': 'goyoalfil.png', 'bR': 'goyotorre.png', 'bQ': 'goyoreina.png', 'bK': 'goyorey.png'
            };
            return customPieces[piece];
        }

        // ============ TABLERO PROPIO: casillas, piezas y resaltados ============
        function sqToFR(sq) { return { f: FILES.indexOf(sq[0]), r: 8 - parseInt(sq[1], 10) }; }
        function frToSq(f, r) { return FILES[f] + (8 - r); }
        function codeDe(cell) { return cell.color + cell.type.toUpperCase(); }

        function construirCasillas() {
            sqLayer.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const d = document.createElement('div');
                    d.className = 'sq ' + (((f + r) % 2 === 0) ? 'light' : 'dark');
                    d.style.left = (f * 12.5) + '%';
                    d.style.top = (r * 12.5) + '%';
                    if (f === 0) {
                        const c = document.createElement('span');
                        c.className = 'coord rank'; c.textContent = (8 - r);
                        d.appendChild(c);
                    }
                    if (r === 7) {
                        const c = document.createElement('span');
                        c.className = 'coord file'; c.textContent = FILES[f];
                        d.appendChild(c);
                    }
                    sqLayer.appendChild(d);
                }
            }
        }

        function colocar(el, f, r, escala) {
            el.style.transform = 'translate(' + (f * 100) + '%, ' + (r * 100) + '%)' + (escala ? ' scale(' + escala + ')' : '');
        }

        function crearPiezaEl(sq, cell) {
            const el = document.createElement('div');
            el.className = 'piece';
            el.style.backgroundImage = 'url("' + pieceTheme(codeDe(cell)) + '")';
            const p = sqToFR(sq);
            colocar(el, p.f, p.r);
            el.dataset.sq = sq;
            return el;
        }

        function renderAll() {
            pcLayer.innerHTML = '';
            pieceEls = {};
            const b = game.board();
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const cell = b[r][f];
                    if (cell) {
                        const sq = frToSq(f, r);
                        const el = crearPiezaEl(sq, cell);
                        pieceEls[sq] = el;
                        pcLayer.appendChild(el);
                    }
                }
            }
        }

        function agregarHL(sq, clase) {
            const p = sqToFR(sq);
            const d = document.createElement('div');
            d.className = 'hl ' + clase;
            d.style.left = (p.f * 12.5) + '%';
            d.style.top = (p.r * 12.5) + '%';
            hlLayer.appendChild(d);
        }

        function pintarResaltados() {
            hlLayer.innerHTML = '';
            if (mostrarAyuda && ultimoOrigen && ultimoDestino) {
                agregarHL(ultimoOrigen, 'hl-last');
                agregarHL(ultimoDestino, 'hl-last');
            }
            if (game.in_check()) {
                const turno = game.turn();
                const b = game.board();
                for (let r = 0; r < 8; r++) {
                    for (let f = 0; f < 8; f++) {
                        if (b[r][f] && b[r][f].type === 'k' && b[r][f].color === turno) {
                            agregarHL(frToSq(f, r), 'hl-check');
                        }
                    }
                }
            }
            if (mostrarAyuda && seleccion) {
                agregarHL(seleccion, 'hl-sel');
                destinosSel.forEach(m => agregarHL(m.to, m.captured ? 'hl-cap' : 'hl-dot'));
            }
        }

        function seleccionar(sq) {
            seleccion = sq;
            destinosSel = sq ? game.moves({ square: sq, verbose: true }) : [];
            pintarResaltados();
        }

        function animarMovimiento(move) {
            const el = pieceEls[move.from];
            if (!el) { renderAll(); return; }
            animando = true;

            // Pieza capturada (incluye captura al paso)
            let capSq = move.to;
            if (move.flags.indexOf('e') !== -1) capSq = move.to[0] + move.from[1];
            if (move.captured && pieceEls[capSq]) {
                const cel = pieceEls[capSq];
                delete pieceEls[capSq];
                cel.style.opacity = '0';
                const cp = sqToFR(capSq);
                colocar(cel, cp.f, cp.r, 0.5);
                setTimeout(() => cel.remove(), 180);
            }

            delete pieceEls[move.from];
            pieceEls[move.to] = el;
            el.dataset.sq = move.to;
            el.style.zIndex = 6;
            const tp = sqToFR(move.to);
            colocar(el, tp.f, tp.r);

            // Enroque: mover también la torre
            if (move.flags.indexOf('k') !== -1 || move.flags.indexOf('q') !== -1) {
                const rank = move.color === 'w' ? '1' : '8';
                const esCorto = move.flags.indexOf('k') !== -1;
                const rFrom = (esCorto ? 'h' : 'a') + rank;
                const rTo = (esCorto ? 'f' : 'd') + rank;
                const rel = pieceEls[rFrom];
                if (rel) {
                    delete pieceEls[rFrom];
                    pieceEls[rTo] = rel;
                    rel.dataset.sq = rTo;
                    const rp = sqToFR(rTo);
                    colocar(rel, rp.f, rp.r);
                }
            }

            if (move.promotion) {
                const img = pieceTheme(move.color + move.promotion.toUpperCase());
                setTimeout(() => { el.style.backgroundImage = 'url("' + img + '")'; }, 170);
            }

            setTimeout(() => { animando = false; el.style.zIndex = 3; renderAll(); }, 210);
        }

        // ============ FLUJO DE JUGADAS ============
        function ejecutarJugada(from, to, promo) {
            const move = game.move({ from: from, to: to, promotion: promo || 'q' });
            if (move === null) { renderAll(); return; }
            animarMovimiento(move);
            despuesDeJugar(move, false);
        }

        function intentarJugada(from, to) {
            const cand = game.moves({ square: from, verbose: true }).filter(m => m.to === to);
            if (cand.length === 0) return false;
            if (cand[0].promotion) {
                promoPendiente = { from: from, to: to };
                mostrarPromo(to);
                return true;
            }
            ejecutarJugada(from, to, 'q');
            return true;
        }

        function mostrarPromo(to) {
            const p = sqToFR(to);
            promoEl.innerHTML = '';
            ['q', 'r', 'b', 'n'].forEach(t => {
                const o = document.createElement('div');
                o.className = 'promo-opt';
                o.style.backgroundImage = 'url("' + pieceTheme('w' + t.toUpperCase()) + '")';
                o.addEventListener('click', ev => {
                    ev.stopPropagation();
                    const pend = promoPendiente;
                    cerrarPromo();
                    if (pend) ejecutarJugada(pend.from, pend.to, t);
                });
                promoEl.appendChild(o);
            });
            promoEl.style.left = (p.f * 12.5) + '%';
            promoEl.style.top = '0%';
            promoEl.classList.remove('hidden');
            promoBackdrop.classList.remove('hidden');
        }

        function cerrarPromo() {
            promoPendiente = null;
            promoEl.classList.add('hidden');
            promoBackdrop.classList.add('hidden');
        }
        promoBackdrop.addEventListener('click', () => { cerrarPromo(); seleccionar(null); renderAll(); });

        function despuesDeJugar(move, esBot) {
            ultimoOrigen = move.from;
            ultimoDestino = move.to;
            seleccion = null; destinosSel = [];
            reproducirSonido(move.captured ? 'captura' : (game.in_check() ? 'jaque' : (esBot ? 'bot' : 'mover')));
            pintarResaltados();
            iniciarReloj();
            actualizarHistorial();
            actualizarCapturadas();
            verificarEstado();

            if (!esBot && !game.game_over() && tiempoBlancas > 0 && tiempoNegras > 0) {
                document.getElementById('estadoJuego').innerHTML = '<i class="fas fa-cog fa-spin"></i> ' + nombreCortoBot + ' está pensando...';
                window.setTimeout(hacerMovimientoIA, 420);
            }
        }

        function actualizarCapturadas() {
            const valores = { p: 1, n: 3, b: 3, r: 5, q: 9 };
            const hist = game.history({ verbose: true });
            let misCap = [], botCap = [], miMat = 0, botMat = 0;
            hist.forEach(m => {
                if (!m.captured) return;
                if (m.color === 'w') { misCap.push(m.captured); miMat += valores[m.captured]; }
                else { botCap.push(m.captured); botMat += valores[m.captured]; }
            });
            const orden = { q: 0, r: 1, b: 2, n: 3, p: 4 };
            misCap.sort((a, b) => orden[a] - orden[b]);
            botCap.sort((a, b) => orden[a] - orden[b]);
            document.getElementById('capPorMi').innerHTML = misCap.map(t => '<img src="' + pieceTheme('b' + t.toUpperCase()) + '" alt="">').join('');
            document.getElementById('capPorBot').innerHTML = botCap.map(t => '<img src="' + pieceTheme('w' + t.toUpperCase()) + '" alt="">').join('');
            const dif = miMat - botMat;
            document.getElementById('difMia').textContent = dif > 0 ? '+' + dif : '';
            document.getElementById('difBot').textContent = dif < 0 ? '+' + (-dif) : '';
        }

        // ============ INTERACCIÓN: arrastrar y clic-clic, como en chess.com ============
        function casillaDesdeEvento(e) {
            const rect = boardEl.getBoundingClientRect();
            const borde = 4; // el marco dorado del tablero
            const f = Math.floor((e.clientX - rect.left - borde) / (rect.width - borde * 2) * 8);
            const r = Math.floor((e.clientY - rect.top - borde) / (rect.height - borde * 2) * 8);
            if (f < 0 || f > 7 || r < 0 || r > 7) return null;
            return frToSq(f, r);
        }

        function puedeMover() {
            return !animando && !promoPendiente && !game.game_over() && game.turn() === 'w' && tiempoBlancas > 0 && tiempoNegras > 0;
        }

        boardEl.addEventListener('pointerdown', e => {
            if (promoPendiente || !puedeMover()) return;
            const sq = casillaDesdeEvento(e);
            if (!sq) return;
            e.preventDefault();

            // Clic en un destino legal de la pieza ya seleccionada: mover
            if (seleccion && sq !== seleccion && destinosSel.some(m => m.to === sq)) {
                intentarJugada(seleccion, sq);
                return;
            }

            const cell = game.get(sq);
            if (cell && cell.color === 'w') {
                const eraSeleccion = (seleccion === sq);
                seleccionar(sq);
                const el = pieceEls[sq];
                if (el) {
                    arrastrando = { from: sq, el: el, startX: e.clientX, startY: e.clientY, activo: false, eraSeleccion: eraSeleccion };
                    boardEl.setPointerCapture(e.pointerId);
                }
            } else {
                seleccionar(null);
            }
        });

        boardEl.addEventListener('pointermove', e => {
            if (!arrastrando) return;
            const dx = e.clientX - arrastrando.startX;
            const dy = e.clientY - arrastrando.startY;
            if (!arrastrando.activo && Math.hypot(dx, dy) > 7) {
                arrastrando.activo = true;
                arrastrando.el.classList.add('drag');
            }
            if (arrastrando.activo) {
                const rect = boardEl.getBoundingClientRect();
                const sqSize = (rect.width - 8) / 8;
                const p = sqToFR(arrastrando.from);
                const baseX = p.f * sqSize, baseY = p.r * sqSize;
                arrastrando.el.style.transform = 'translate(' + (baseX + dx) + 'px, ' + (baseY + dy) + 'px) scale(1.12)';
            }
        });

        function finArrastre(e) {
            if (!arrastrando) return;
            const d = arrastrando;
            arrastrando = null;
            d.el.classList.remove('drag');
            const origen = sqToFR(d.from);

            if (!d.activo) {
                // Fue un clic: si la pieza ya estaba seleccionada, se deselecciona
                colocar(d.el, origen.f, origen.r);
                if (d.eraSeleccion) seleccionar(null);
                return;
            }

            const destino = casillaDesdeEvento(e);
            if (destino && destino !== d.from && destinosSel.some(m => m.to === destino)) {
                // La animación de llegada parte de donde soltaste la pieza
                d.el.style.transition = 'transform 0.12s ease-out';
                intentarJugada(d.from, destino);
                setTimeout(() => { d.el.style.transition = ''; }, 140);
            } else if (destino === d.from) {
                colocar(d.el, origen.f, origen.r); // soltó en el mismo sitio: queda seleccionada
            } else {
                colocar(d.el, origen.f, origen.r); // destino ilegal: regresa y se deselecciona
                seleccionar(null);
            }
        }
        boardEl.addEventListener('pointerup', finArrastre);
        boardEl.addEventListener('pointercancel', finArrastre);

        function deshacerJugada() {
            if (game.history().length < 2 || game.game_over()) return;
            game.undo();
            game.undo();
            cerrarPromo();
            seleccion = null; destinosSel = [];
            renderAll();
            ultimoOrigen = null; ultimoDestino = null;
            pintarResaltados();
            actualizarHistorial();
            actualizarCapturadas();
            verificarEstado();
        }

        function reiniciarPartida() {
            Swal.fire({
                title: '¿Reiniciar partida?', text: "Comenzarás un nuevo duelo desde cero.", icon: 'question',
                showCancelButton: true, confirmButtonColor: '#06d6a0', cancelButtonColor: '#3a506b', confirmButtonText: 'Sí, reiniciar', background: '#1c2541', color: '#fff'
            }).then((result) => {
                if (result.isConfirmed) {
                    game.reset();
                    cerrarPromo();
                    seleccion = null; destinosSel = [];
                    renderAll();
                    clearInterval(timerInterval); juegoIniciado = false;
                    ultimoOrigen = null; ultimoDestino = null; pintarResaltados();
                    tiempoBlancas = tiempoInicial; tiempoNegras = tiempoInicial; actualizarRelojesUI();
                    document.getElementById('moveHistory').innerHTML = '';
                    document.getElementById('capPorMi').innerHTML = '';
                    document.getElementById('capPorBot').innerHTML = '';
                    document.getElementById('difMia').textContent = '';
                    document.getElementById('difBot').textContent = '';
                    document.getElementById('ultimaJugadaBot').innerText = '';
                    document.getElementById('estadoJuego').innerText = '¡Haz tu primer movimiento para iniciar!';
                    document.getElementById('relojBlancas').className = 'clock clock-inactive';
                    document.getElementById('relojNegras').className = 'clock clock-inactive';
                }
            });
        }

        function formatoTiempo(segundos) {
            let min = Math.floor(segundos / 60); let seg = segundos % 60;
            return (min < 10 ? "0" + min : min) + ":" + (seg < 10 ? "0" + seg : seg);
        }

        function actualizarRelojesUI() {
            document.getElementById('relojBlancas').innerHTML = `<i class="fas fa-stopwatch"></i> Tú: ${formatoTiempo(tiempoBlancas)}`;
            document.getElementById('relojNegras').innerHTML = `<i class="fas fa-robot"></i> ${nombreCortoBot}: ${formatoTiempo(tiempoNegras)}`;
            if (juegoIniciado) {
                document.getElementById('relojBlancas').className = game.turn() === 'w' ? 'clock clock-active' : 'clock clock-inactive';
                document.getElementById('relojNegras').className = game.turn() === 'b' ? 'clock clock-active' : 'clock clock-inactive';
            }
        }

        function iniciarReloj() {
            if (!juegoIniciado) {
                juegoIniciado = true;
                timerInterval = setInterval(() => {
                    if (game.game_over()) { clearInterval(timerInterval); return; }
                    if (game.turn() === 'w') {
                        tiempoBlancas--; if (tiempoBlancas <= 0) finDelJuego("Tiempo Agotado", `Gana ${nombreCortoBot}`, 'error');
                    } else {
                        tiempoNegras--; if (tiempoNegras <= 0) finDelJuego("Tiempo Agotado", "¡Ganaste por tiempo!", 'success');
                    }
                    actualizarRelojesUI();
                }, 1000);
            }
            actualizarRelojesUI();
        }

        function finDelJuego(titulo, mensaje, icono) {
            clearInterval(timerInterval);
            document.getElementById('estadoJuego').innerText = titulo + " - " + mensaje;
            if (icono === 'success') lanzarConfeti();
            Swal.fire({ title: titulo, text: mensaje, icon: icono, background: '#1c2541', color: '#fff', confirmButtonColor: '#06d6a0' });
        }

        function actualizarHistorial() {
            const historial = game.history(); const panel = document.getElementById('moveHistory'); let html = '';
            for (let i = 0; i < historial.length; i += 2) {
                html += `<div><b>${(i / 2) + 1}.</b></div> <div>${historial[i]}</div> <div style="color:#ffd700;">${historial[i + 1] || ''}</div>`;
            }
            panel.innerHTML = html; panel.parentElement.scrollTop = panel.parentElement.scrollHeight;
        }

        // --- MOTOR DE INTELIGENCIA ARTIFICIAL POR NIVELES ---
        const valorPieza = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        function evaluarTablero(chessObj) {
            if (chessObj.in_checkmate()) return chessObj.turn() === 'w' ? 99999 : -99999;
            if (chessObj.in_draw()) return 0;
            const b = chessObj.board();
            let score = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = b[r][c];
                    if (p) {
                        const bonusCentro = (r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 15 : 0;
                        const val = valorPieza[p.type] + bonusCentro;
                        score += (p.color === 'b') ? val : -val;
                    }
                }
            }
            return score;
        }

        function minimax(chessObj, depth, alpha, beta, esMaximizador) {
            if (depth === 0 || chessObj.game_over()) return evaluarTablero(chessObj);
            const movimientos = chessObj.moves({ verbose: true });

            if (esMaximizador) {
                let maxEval = -Infinity;
                for (let m of movimientos) {
                    chessObj.move(m);
                    let evaluacion = minimax(chessObj, depth - 1, alpha, beta, false);
                    chessObj.undo();
                    maxEval = Math.max(maxEval, evaluacion);
                    alpha = Math.max(alpha, evaluacion);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let m of movimientos) {
                    chessObj.move(m);
                    let evaluacion = minimax(chessObj, depth - 1, alpha, beta, true);
                    chessObj.undo();
                    minEval = Math.min(minEval, evaluacion);
                    beta = Math.min(beta, evaluacion);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function elegirJugadaSegunBot() {
            const movimientos = game.moves({ verbose: true });
            if (movimientos.length === 0) return null;

            if (nivelIA === 1 && Math.random() < 0.8) {
                return movimientos[Math.floor(Math.random() * movimientos.length)];
            }

            if (nivelIA <= 2) {
                const capturas = movimientos.filter(m => m.captured);
                if (capturas.length > 0 && Math.random() < 0.75) {
                    return capturas[Math.floor(Math.random() * capturas.length)];
                }
                return movimientos[Math.floor(Math.random() * movimientos.length)];
            }

            const profundidad = nivelIA === 3 ? 1 : (nivelIA === 4 ? 2 : 3);
            let mejorMov = movimientos[0];
            let mejorValor = -Infinity;

            movimientos.sort(() => Math.random() - 0.5);

            for (let m of movimientos) {
                game.move(m);
                let valor = minimax(game, profundidad - 1, -Infinity, Infinity, false);
                game.undo();
                if (valor > mejorValor) {
                    mejorValor = valor;
                    mejorMov = m;
                }
            }
            return mejorMov;
        }

        function hacerMovimientoIA() {
            if (game.game_over() || game.turn() !== 'b') return;
            const jugadaElegida = elegirJugadaSegunBot();
            if (!jugadaElegida) return;

            var move = game.move(jugadaElegida);
            animarMovimiento(move);

            ultimoOrigen = move.from;
            ultimoDestino = move.to;
            document.getElementById('ultimaJugadaBot').innerHTML = `<i class="fas fa-bell"></i> Bot jugó: ${move.from}-${move.to} (${move.san})`;
            despuesDeJugar(move, true);
        }

        function verificarEstado() {
            if (tiempoBlancas <= 0 || tiempoNegras <= 0) return;
            if (game.in_checkmate()) {
                let ganoJugador = game.turn() === 'b';
                let msg = ganoJugador ? `¡Derrotaste a ${nombreCortoBot}!` : `${nombreCortoBot} te ha dado Jaque Mate.`;
                finDelJuego("¡Jaque Mate!", msg, ganoJugador ? 'success' : 'error');
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                finDelJuego("Tablas", "La batalla histórica ha terminado en empate.", 'info');
            } else {
                let status = game.turn() === 'b' ? `Turno de ${nombreCortoBot}` : '🟢 Tu Turno (Blancas)';
                if (game.in_check()) status = '⚠️ ¡ESTÁS EN JAQUE! Defiende a tu Rey';
                document.getElementById('estadoJuego').innerText = status;
            }
        }

        function lanzarConfeti() {
            var duration = 3 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#06d6a0'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#06d6a0'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // --- ARRANQUE ---
        construirCasillas();
        renderAll();
        pintarResaltados();
        actualizarRelojesUI();
    </script>
</body>
